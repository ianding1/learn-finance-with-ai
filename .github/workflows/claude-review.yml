name: AI review

# Advisory review by Claude against .github/review-rules.md. It comments on the pull request but
# never blocks merging; the blocking checks are in checks.yml.
# Needs the repository secret ANTHROPIC_API_KEY. Without it, this workflow does nothing.
# Pull requests from forks do not receive secrets, so they are not reviewed automatically.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the course website "Learn Finance with AI".
            First read CLAUDE.md and .github/review-rules.md. Apply every rule in review-rules.md
            to the changed files, and to unchanged files that depend on them (rule 5).
            Use `gh pr diff` to see the changes.

            Report each problem as an inline comment on the line, naming the rule (for example "[R2]").
            Then post one summary comment that lists the rules you checked and the problems found,
            or says that no problems were found. Do not comment on style preferences that no rule covers.
            Do not judge whether the economics or finance content is correct; rules R1–R10 are about
            consistency, not accuracy. Write in the language of the pull request description.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(python3 scripts/check.py)"
