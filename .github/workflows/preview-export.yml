name: Preview export (temporary)
on:
  push:
    branches: [ci-preview]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Push build output and lockfile to ci-output
        run: |
          mkdir out && cp -r dist out/dist && cp package-lock.json out/
          cd out
          git init -q -b ci-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "build output"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-output
