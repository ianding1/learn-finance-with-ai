name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  consistency:
    name: Consistency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/check.py

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build (fails on broken LaTeX, missing questions or unknown references)
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Show build errors as an annotation
        if: failure()
        run: |
          msg=$(grep -v '^[[:space:]]*$' build.log | tail -n 60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build failed::$msg"
      - name: Upload lockfile when it was generated here
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: package-lock
          path: package-lock.json
