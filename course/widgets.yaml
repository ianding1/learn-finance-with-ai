# Interactive figure registry. Questions that ask the learner to set a parameter
# (`widget: { id, set: { param: value } }` in a key file) are checked against these ranges.
# Keep this file in sync with the component's slider attributes.

diversification:
  component: src/components/widgets/DiversificationSlider.astro
  params:
    rho: { min: -1, max: 1, step: 0.05, default: 0.5 }
    w: { min: 0, max: 1, step: 0.01, default: 0.5 }
  fixed:
    sigma_A: 20
    sigma_B: 10

annuity:
  component: src/components/widgets/AnnuityTimeline.astro
  params:
    r: { min: 0, max: 0.2, step: 0.01, default: 0.1 }
    n: { min: 1, max: 10, step: 1, default: 3 }
  fixed:
    payment: 100

fixed-cost:
  component: src/components/widgets/FixedCostProfit.astro
  params:
    F: { min: 0, max: 600, step: 10, default: 100 }
  fixed:
    price: 40

tangency:
  component: src/components/widgets/BudgetTangency.astro
  params:
    x: { min: 2, max: 48, step: 0.5, default: 10 }
  fixed:
    p_x: 2
    p_y: 4
    M: 100

coin-flip:
  component: src/components/widgets/CoinFlipWealth.astro
  params:
    n: { min: 1, max: 20, step: 1, default: 10 }
  fixed:
    up: 1.5
    down: 0.6

ci-sim:
  component: src/components/widgets/ConfidenceIntervals.astro
  params:
    n: { min: 2, max: 50, step: 1, default: 20 }
  fixed:
    mu: 8
    sigma: 16
    histories: 100

regression:
  component: src/components/widgets/RegressionFit.astro
  params:
    a: { min: -3, max: 5, step: 0.1, default: 0 }
    b: { min: 0, max: 3, step: 0.05, default: 1 }

supply-demand:
  component: src/components/widgets/SupplyDemand.astro
  params:
    dD: { min: -30, max: 30, step: 5, default: 0 }
    dS: { min: -30, max: 30, step: 5, default: 0 }

slutsky:
  component: src/components/widgets/SlutskyDecomposition.astro
  params:
    p: { min: 0.5, max: 4, step: 0.25, default: 1 }
  fixed:
    M: 40
    p_y: 1
    p_x_original: 2

fisher:
  component: src/components/widgets/FisherTwoPeriod.astro
  params:
    r: { min: 0, max: 30, step: 1, default: 10 }
    y2: { min: 0, max: 60, step: 2, default: 22 }
  fixed:
    y1: 80
    beta: 0.95

risk-premium:
  component: src/components/widgets/RiskPremium.astro
  params:
    g: { min: 0, max: 5, step: 0.5, default: 1 }
    h: { min: 10, max: 90, step: 10, default: 50 }
  fixed:
    wealth: 100

competitive-firm:
  component: src/components/widgets/CompetitiveFirm.astro
  params:
    p: { min: 10, max: 50, step: 1, default: 35 }
  fixed:
    fixed_cost: 72

cournot:
  component: src/components/widgets/CournotFirms.astro
  params:
    n: { min: 1, max: 20, step: 1, default: 2 }
  fixed:
    a: 100
    c: 20

repeated-game:
  component: src/components/widgets/RepeatedGame.astro
  params:
    delta: { min: 0.05, max: 0.95, step: 0.05, default: 0.3 }
  fixed:
    keep: 10
    cheat: 15
    punish: 5
    periods: 30

surplus-tax:
  component: src/components/widgets/SurplusTax.astro
  params:
    t: { min: 0, max: 30, step: 1, default: 0 }
  fixed:
    demand: "Qd = 100 - 2P"
    supply: "Qs = -20 + 4P"

lemons:
  component: src/components/widgets/LemonsMarket.astro
  params:
    q: { min: 0, max: 1, step: 0.05, default: 0.5 }
  fixed:
    good_buyer: 10000
    good_seller: 8000
    lemon_buyer: 4000
    lemon_seller: 3000
