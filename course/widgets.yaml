# Interactive figure registry. Questions that ask the learner to set a parameter
# (`widget: { id, set: { param: value } }` in a key file) are checked against these ranges.
# Keep this file in sync with the component's slider attributes.

diversification:
  component: src/components/widgets/DiversificationSlider.astro
  params:
    rho: { min: -1, max: 1, step: 0.05, default: 0.5 }
    w: { min: 0, max: 1, step: 0.01, default: 0.5 }
  fixed:
    sigma_A: 20
    sigma_B: 10

annuity:
  component: src/components/widgets/AnnuityTimeline.astro
  params:
    r: { min: 0, max: 0.2, step: 0.01, default: 0.1 }
    n: { min: 1, max: 10, step: 1, default: 3 }
  fixed:
    payment: 100

fixed-cost:
  component: src/components/widgets/FixedCostProfit.astro
  params:
    F: { min: 0, max: 600, step: 10, default: 100 }
  fixed:
    price: 40

tangency:
  component: src/components/widgets/BudgetTangency.astro
  params:
    x: { min: 2, max: 48, step: 0.5, default: 10 }
  fixed:
    p_x: 2
    p_y: 4
    M: 100
