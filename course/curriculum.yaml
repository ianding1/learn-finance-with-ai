      - { id: "3.2", slug: "3-2-npv-irr", title: { zh: "NPV、IRR 与资本预算", en: "NPV, IRR and Capital Budgeting" } }
      - { id: "3.3", slug: "3-3-bond-pricing", title: { zh: "债券定价", en: "Bond Pricing" } }
      - { id: "3.4", slug: "3-4-interest-rate-risk", title: { zh: "利率风险", en: "Interest Rate Risk" } }
      - { id: "3.5", slug: "3-5-term-structure", title: { zh: "利率期限结构", en: "The Term Structure of Interest Rates" } }
      - { id: "3.6", slug: "3-6-credit-risk", title: { zh: "信用风险", en: "Credit Risk" } }
      - { id: "E3a", slug: "e3a-exam", exam: true, title: { zh: "考试 E3a：金融市场与固定收益", en: "Exam E3a: Financial Markets and Fixed Income" } }
      - { id: "3.7", slug: "3-7-financial-statements", title: { zh: "财务报表分析", en: "Financial Statement Analysis" } }
