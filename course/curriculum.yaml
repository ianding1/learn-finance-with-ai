# Course outline. Single source of truth for lesson order, titles, slugs and publication status.
# Order in this file = teaching order. Concept-order checks use it.
#
# Lesson fields:
#   id:          lesson number, e.g. "0.3" (exams use "E0" etc.)
#   slug:        URL slug under /lessons/ (same in every language)
#   title:       { zh, en }
#   summary:     { zh, en } one sentence, used in link previews and prompts (required when published)
#   published:   true when the lesson page exists in every language
#   introduces:  concept ids defined in this lesson (see concepts.yaml) — published lessons only
#   uses:        concept ids from earlier lessons that this lesson relies on — published lessons only

stages:
  - id: "0"
    title: { zh: "第 0 阶段：数学与统计工具", en: "Stage 0: Math and Statistics Tools" }
    lessons:
      - id: "0.1"
        slug: "0-1-time-value-of-money"
        title: { zh: "复利与货币时间价值", en: "Compounding and the Time Value of Money" }
      - id: "0.2"
        slug: "0-2-optimization"
        title: { zh: "优化", en: "Optimization" }
      - id: "0.3"
        slug: "0-3-probability"
        title: { zh: "概率：期望、方差、协方差与组合方差", en: "Probability: Expectation, Variance, Covariance and Portfolio Variance" }
        summary:
          zh: "用情景表描述投资收益，计算期望、方差、协方差，推导两资产组合的方差公式，并解释分散化的来源。"
          en: "Describe investment returns with a scenario table, compute expectation, variance and covariance, derive the variance of a two-asset portfolio, and explain where diversification comes from."
        published: true
        introduces: [random-variable, expected-value, variance, standard-deviation, covariance, correlation, portfolio-variance, diversification]
        uses: [summation, profit-maximization, sunk-cost, budget-constraint]
      - id: "0.4"
        slug: "0-4-distributions-inference"
        title: { zh: "分布与统计推断", en: "Distributions and Statistical Inference" }
      - id: "0.5"
        slug: "0-5-regression"
        title: { zh: "回归", en: "Regression" }
      - id: "E0"
        slug: "e0-exam"
        exam: true
        title: { zh: "考试 E0：数学与统计工具", en: "Exam E0: Math and Statistics Tools" }

  - id: "1"
    title: { zh: "第 1 阶段：微观经济学", en: "Stage 1: Microeconomics" }
    lessons:
      - { id: "1.1", slug: "1-1-supply-demand", title: { zh: "供给与需求", en: "Supply and Demand" } }
      - { id: "1.2", slug: "1-2-consumer-theory", title: { zh: "消费者理论", en: "Consumer Theory" } }
      - { id: "1.3", slug: "1-3-intertemporal-choice", title: { zh: "跨期选择", en: "Intertemporal Choice" } }
      - { id: "1.4", slug: "1-4-choice-under-uncertainty", title: { zh: "不确定性下的选择", en: "Choice Under Uncertainty" } }
      - { id: "1.5", slug: "1-5-producer-theory", title: { zh: "生产者理论", en: "Producer Theory" } }
      - { id: "1.6", slug: "1-6-market-structure", title: { zh: "市场结构", en: "Market Structure" } }
      - { id: "1.7", slug: "1-7-game-theory", title: { zh: "博弈论基础", en: "Basic Game Theory" } }
      - { id: "1.8", slug: "1-8-welfare-market-failure", title: { zh: "福利与市场失灵", en: "Welfare and Market Failure" } }
      - { id: "1.9", slug: "1-9-information-economics", title: { zh: "信息经济学", en: "Information Economics" } }
      - { id: "E1", slug: "e1-exam", exam: true, title: { zh: "考试 E1：微观经济学", en: "Exam E1: Microeconomics" } }

  - id: "2"
    title: { zh: "第 2 阶段：宏观经济学", en: "Stage 2: Macroeconomics" }
    lessons:
      - { id: "2.1", slug: "2-1-macro-data", title: { zh: "宏观数据", en: "Macroeconomic Data" } }
      - { id: "2.2", slug: "2-2-long-run-growth", title: { zh: "长期增长", en: "Long-Run Growth" } }
      - { id: "2.3", slug: "2-3-money-banking", title: { zh: "货币与银行", en: "Money and Banking" } }
      - { id: "2.4", slug: "2-4-short-run-fluctuations", title: { zh: "短期波动", en: "Short-Run Fluctuations" } }
      - { id: "2.5", slug: "2-5-monetary-policy", title: { zh: "货币政策", en: "Monetary Policy" } }
      - { id: "2.6", slug: "2-6-fiscal-policy", title: { zh: "财政政策", en: "Fiscal Policy" } }
      - { id: "2.7", slug: "2-7-open-economy", title: { zh: "开放经济", en: "The Open Economy" } }
      - { id: "2.8", slug: "2-8-business-cycle-asset-prices", title: { zh: "经济周期与资产价格", en: "Business Cycles and Asset Prices" } }
      - { id: "E2", slug: "e2-exam", exam: true, title: { zh: "考试 E2：宏观经济学", en: "Exam E2: Macroeconomics" } }

  - id: "3"
