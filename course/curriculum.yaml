      - { id: "3.10", slug: "3-10-equity-valuation-dcf", title: { zh: "股票估值 II：自由现金流贴现", en: "Equity Valuation II: Discounted Free Cash Flow" } }
      - { id: "3.11", slug: "3-11-relative-valuation", title: { zh: "股票估值 III：相对估值", en: "Equity Valuation III: Relative Valuation" } }
      - { id: "E3b", slug: "e3b-exam", exam: true, title: { zh: "考试 E3b：财务分析与股票估值", en: "Exam E3b: Financial Analysis and Equity Valuation" } }

  - id: "4"
    title: { zh: "第 4 阶段：投资理论与组合建模", en: "Stage 4: Investment Theory and Portfolio Modeling" }
    lessons:
      - { id: "4.1", slug: "4-1-risk-return-measures", title: { zh: "收益与风险的度量", en: "Measuring Return and Risk" } }
