      - { id: "4.9", slug: "4-9-performance-evaluation", title: { zh: "业绩评估", en: "Performance Evaluation" } }
      - { id: "E4b", slug: "e4b-exam", exam: true, title: { zh: "考试 E4b：市场效率、行为金融与业绩评估", en: "Exam E4b: Market Efficiency, Behavioral Finance and Performance Evaluation" } }
      - { id: "4.10", slug: "4-10-estimation-error", title: { zh: "估计误差与稳健优化", en: "Estimation Error and Robust Optimization" } }
