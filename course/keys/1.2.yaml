# Answer key for lesson 1.2. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[0.2]] (lesson), [[1.2#slutsky]] (section), [[concept:demand]], [[check:Q4]].
# expected: values are recomputed by course/verify/1.2.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "1.2"

context:
  - zh: |-
      学习者学过偏导数、预算约束、拉格朗日乘数法、“挪一美元”的论证（内部最优点 $\frac{MU_x}{p_x} = \frac{MU_y}{p_y}$）和角点解（[[0.2]]），以及需求、正常品和劣等品（[[1.1]]）。[[0.2]] 的练习题已推出 $U = xy$ 的需求函数 $x^* = \frac{M}{2p_x}$、$y^* = \frac{M}{2p_y}$。还没有学跨期选择（[[1.3]]）和不确定性下的选择（[[1.4]]）。
    en: |-
      The learner has studied partial derivatives, budget constraints, the Lagrange multiplier method, the "move one dollar" argument (an interior optimum satisfies $\frac{MU_x}{p_x} = \frac{MU_y}{p_y}$) and corner solutions ([[0.2]]), as well as demand and normal and inferior goods ([[1.1]]). An exercise in [[0.2]] derived the demand functions for $U = xy$: $x^* = \frac{M}{2p_x}$ and $y^* = \frac{M}{2p_y}$. The learner has not yet studied intertemporal choice ([[1.3]]) or choice under uncertainty ([[1.4]]).
  - concepts: [preferences, utility-function, marginal-utility]
    zh: |-
      讲义列出偏好的四个假设（完备性、传递性、多多益善、凸性），说明效用函数只用来排序、严格递增变换表示同一种偏好（序数效用），并定义边际效用。讲义没有证明变换后 MRS 不变。
    en: |-
      The lesson lists four assumptions on preferences (completeness, transitivity, monotonicity, convexity), explains that a utility function is only used for ranking and that a strictly increasing transformation represents the same preferences (ordinal utility), and defines marginal utility. The lesson does not prove that the MRS is unchanged by a transformation.
  - concepts: [indifference-curve, marginal-rate-of-substitution]
    zh: |-
      讲义定义 $MRS = -\frac{dy}{dx}\big|_{U} = \frac{MU_x}{MU_y}$；例：$U = xy$ 时 $MRS = \frac{y}{x}$，在 $(4, 9)$ 为 2.25。凸性意味着无差异曲线凸向原点。
    en: |-
      The lesson defines $MRS = -\frac{dy}{dx}\big|_{U} = \frac{MU_x}{MU_y}$; example: for $U = xy$, $MRS = \frac{y}{x}$, which is 2.25 at $(4, 9)$. Convexity means indifference curves bow toward the origin.
  - concepts: [budget-constraint, corner-solution]
    zh: |-
      讲义给出内部最优条件 $MRS = \frac{p_x}{p_y}$（相切）；例：$U = xy$，$p_x = 2$，$p_y = 1$，$M = 40$，$x^* = 10$，$y^* = 20$。讲义提到完全互补 $U = \min(x, y)$ 的最优点在拐角、完全替代 $U = x + y$ 通常是角点解，但没有具体求解。
    en: |-
      The lesson gives the interior optimality condition $MRS = \frac{p_x}{p_y}$ (tangency); example: $U = xy$, $p_x = 2$, $p_y = 1$, $M = 40$ give $x^* = 10$ and $y^* = 20$. The lesson mentions that with perfect complements $U = \min(x, y)$ the optimum is at the kink and that perfect substitutes $U = x + y$ usually give a corner solution, but it does not solve either case.
  - concepts: [substitution-effect, income-effect, slutsky-equation, giffen-good]
    zh: |-
      讲义用 Slutsky 补偿（调整收入使新价格下恰好买得起原组合）分解价格变化。例：$U = xy$，$M = 40$，$p_y = 1$，$p_x$ 从 2 降到 1：A $x = 10$，补偿收入 30，B $x = 15$，C $x = 20$，替代效应 5、收入效应 5。讲义给出 Slutsky 方程 $\frac{\partial x}{\partial p_x} = \frac{\partial x^s}{\partial p_x} - x\frac{\partial x}{\partial M}$（推导留给练习题），说明替代效应总是使需求量与价格反向变化，劣等品的收入效应方向相反，吉芬商品的收入效应超过替代效应。[[fig:5-1]] 中 $p_x$ 的滑块从 0.5 到 4，步长 0.25。
    en: |-
      The lesson splits a price change with Slutsky compensation (adjusting income so that the original bundle is just affordable at the new prices). Example: $U = xy$, $M = 40$, $p_y = 1$, $p_x$ falls from 2 to 1: A has $x = 10$, compensated income is 30, B has $x = 15$, C has $x = 20$; substitution effect 5, income effect 5. The lesson states the Slutsky equation $\frac{\partial x}{\partial p_x} = \frac{\partial x^s}{\partial p_x} - x\frac{\partial x}{\partial M}$ (the derivation is left to an exercise), explains that the substitution effect always moves the quantity demanded opposite to the price, that the income effect of an inferior good goes the other way, and that a Giffen good's income effect outweighs its substitution effect. In [[fig:5-1]] the slider for $p_x$ goes from 0.5 to 4 in steps of 0.25.

common_errors:
  - questions: [C2, Q2]
    zh: |-
      把边际替代率写反（$\frac{MU_y}{MU_x}$），或把它和价格比的比较方向弄反：$MRS > \frac{p_x}{p_y}$ 时应该多买 $x$。
    en: |-
      Writing the marginal rate of substitution upside down ($\frac{MU_y}{MU_x}$), or comparing it with the price ratio in the wrong direction: when $MRS > \frac{p_x}{p_y}$, the consumer should buy more $x$.
  - questions: [C3, Q3]
    zh: |-
      对完全互补或完全替代的偏好仍然套用相切条件 $MRS = \frac{p_x}{p_y}$。
    en: |-
      Applying the tangency condition $MRS = \frac{p_x}{p_y}$ to perfect complements or perfect substitutes.
  - questions: [C4, Q5, Q6]
    zh: |-
      补偿收入算错：Slutsky 补偿是让消费者在新价格下恰好买得起原来的组合，补偿收入 = 新价格 × 原来的数量之和，而不是让他回到原来的效用水平。
    en: |-
      Computing the compensated income incorrectly: Slutsky compensation makes the original bundle just affordable at the new prices, so compensated income is the sum of new prices times the original quantities, not the income that restores the original utility.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: utility
    concepts: [utility-function, preferences]
    expected: { u1: "16", u2: "16", u3: "15", w2: "8" }
    question:
      zh: |-
        三个组合：A $(2, 8)$、B $(4, 4)$、C $(3, 5)$。
        (a) 用 $U = xy$ 给它们排序。
        (b) 用 $V = \ln x + \ln y$ 排序，结果和 (a) 一样吗？
        (c) 用 $W = x + y$ 排序。$W$ 和 $U$ 表示的是同一种偏好吗？
      en: |-
        Three bundles: A $(2, 8)$, B $(4, 4)$ and C $(3, 5)$.
        (a) Rank them with $U = xy$.
        (b) Rank them with $V = \ln x + \ln y$. Is the result the same as in (a)?
        (c) Rank them with $W = x + y$. Do $W$ and $U$ represent the same preferences?
    answer:
      zh: |-
        (a) $U$：A 为 16，B 为 16，C 为 15。A 与 B 一样好，都优于 C。
        (b) $V = \ln(xy)$：$\ln 16$、$\ln 16$、$\ln 15$，排序相同。$V$ 是 $U$ 的严格递增变换，表示同一种偏好。
        (c) $W$：A 为 10，B 为 8，C 为 8。A 最好，B 与 C 一样好。排序不同，所以 $W$ 和 $U$ 表示不同的偏好（$W$ 不是 $U$ 的递增变换）。
      en: |-
        (a) $U$: A is 16, B is 16 and C is 15. A and B are equally good, and both are better than C.
        (b) $V = \ln(xy)$ gives $\ln 16$, $\ln 16$ and $\ln 15$: the same ranking. $V$ is a strictly increasing transformation of $U$ and represents the same preferences.
        (c) $W$: A is 10, B is 8 and C is 8. A is best, and B and C are equally good. The ranking differs, so $W$ and $U$ represent different preferences ($W$ is not an increasing transformation of $U$).
    rubric:
      zh:
        - "(a) A ~ B ≻ C。"
        - "(b) 排序相同，并说明对数是递增变换。"
        - "(c) 排序为 A ≻ B ~ C，与 $U$ 不同，不是同一种偏好。"
      en:
        - "(a) A ~ B ≻ C."
        - "(b) The same ranking, explained by the logarithm being an increasing transformation."
        - "(c) The ranking A ≻ B ~ C differs from $U$, so the preferences are different."

  - id: C2
    kind: check
    section: mrs
    concepts: [marginal-rate-of-substitution, marginal-utility]
    expected: { mux: "24", muy: "9", mrs: "2.67" }
    question:
      zh: |-
        效用函数 $U = x^2 y$。在组合 $(3, 4)$ 处，两种商品的边际效用和边际替代率各是多少？如果 $\frac{p_x}{p_y} = 2$，这个消费者应该多买 $x$ 还是少买 $x$？
      en: |-
        The utility function is $U = x^2 y$. At the bundle $(3, 4)$, what are the marginal utilities of the two goods and the marginal rate of substitution? If $\frac{p_x}{p_y} = 2$, should this consumer buy more $x$ or less?
    answer:
      zh: |-
        $MU_x = 2xy = 24$，$MU_y = x^2 = 9$，$MRS = \frac{24}{9} \approx 2.67$。
        消费者愿意用约 2.67 单位 $y$ 换 1 单位 $x$，而市场上只需 2 单位 $y$ 就能换到 1 单位 $x$。$MRS > \frac{p_x}{p_y}$，应该多买 $x$、少买 $y$。
      en: |-
        $MU_x = 2xy = 24$, $MU_y = x^2 = 9$ and $MRS = \frac{24}{9} \approx 2.67$.
        The consumer is willing to give about 2.67 units of $y$ for 1 unit of $x$, while the market asks only 2 units of $y$. Since $MRS > \frac{p_x}{p_y}$, the consumer should buy more $x$ and less $y$.
    rubric:
      zh:
        - "两个边际效用 24 和 9，MRS 约 2.67。"
        - "比较 MRS 与价格比，结论为多买 $x$。"
      en:
        - "Marginal utilities 24 and 9, MRS about 2.67."
        - "Compares the MRS with the price ratio and concludes: buy more $x$."

  - id: C3
    kind: check
    section: optimal-choice
    concepts: [budget-constraint, indifference-curve]
    expected: { x: "20" }
    question:
      zh: |-
        一个人只在左鞋和右鞋成对时才得到效用：$U = \min(x, y)$，$x$ 是左鞋、$y$ 是右鞋的数量。假设左鞋每只 3 美元、右鞋每只 2 美元，预算 100 美元。他会各买多少只？为什么这里不能用 $MRS = \frac{p_x}{p_y}$？
      en: |-
        A person gets utility only from left and right shoes in pairs: $U = \min(x, y)$, where $x$ is the number of left shoes and $y$ the number of right shoes. Suppose a left shoe costs 3 dollars, a right shoe 2 dollars, and the budget is 100 dollars. How many of each does he buy? Why can't $MRS = \frac{p_x}{p_y}$ be used here?
    answer:
      zh: |-
        多出来的单只鞋不增加效用，所以最优时 $x = y$。代入预算 $3x + 2x = 100$，$x = y = 20$。
        无差异曲线是直角，在拐角处没有确定的斜率，MRS 没有定义；最优点在拐角上，而不是在一个切点上。
      en: |-
        An unmatched shoe adds no utility, so at the optimum $x = y$. The budget gives $3x + 2x = 100$, so $x = y = 20$.
        The indifference curves are right angles; at the corner there is no single slope and the MRS is not defined. The optimum is at the kink, not at a point of tangency.
    rubric:
      zh:
        - "各买 20 只。"
        - "指出无差异曲线是直角、最优点在拐角，MRS 没有定义或相切条件不适用。"
      en:
        - "20 of each."
        - "Points out that the indifference curves are right angles and the optimum is at the kink, so the MRS is not defined or the tangency condition does not apply."

  - id: C4
    kind: check
    section: slutsky
    concepts: [substitution-effect, income-effect]
    widget: { id: slutsky, set: { p: 0.5 } }
    expected: { xb: "25", xc: "40", se: "15", ie: "15" }
    question:
      zh: |-
        在 [[fig:5-1]] 中把 $p_x$ 调到 0.5。补偿收入是多少？B 和 C 的 $x$ 各是多少？替代效应和收入效应各是多少？在这个例子中，$x$ 是正常品还是劣等品？
      en: |-
        In [[fig:5-1]], set $p_x$ to 0.5. What is the compensated income? What is $x$ at B and at C? How large are the substitution effect and the income effect? Is $x$ a normal good or an inferior good in this example?
    answer:
      zh: |-
        补偿收入 $M' = 0.5 \times 10 + 1 \times 20 = 25$，B：$x = \frac{25}{2 \times 0.5} = 25$；C：$x = \frac{40}{2 \times 0.5} = 40$。
        替代效应 $25 - 10 = 15$，收入效应 $40 - 25 = 15$，总效应 30。
        收入效应与替代效应方向相同（降价使实际收入增加，$x$ 随之增加），$x$ 是正常品；从需求函数 $x = \frac{M}{2p_x}$ 也能看出 $\frac{\partial x}{\partial M} > 0$。
      en: |-
        Compensated income $M' = 0.5 \times 10 + 1 \times 20 = 25$. B: $x = \frac{25}{2 \times 0.5} = 25$; C: $x = \frac{40}{2 \times 0.5} = 40$.
        Substitution effect $25 - 10 = 15$, income effect $40 - 25 = 15$, total effect 30.
        The income effect has the same direction as the substitution effect (the price cut raises real income and $x$ rises with it), so $x$ is a normal good; the demand function $x = \frac{M}{2p_x}$ also shows $\frac{\partial x}{\partial M} > 0$.
    rubric:
      zh:
        - "补偿收入 25，B 为 25，C 为 40。"
        - "替代效应 15，收入效应 15。"
        - "判断为正常品并说明理由。"
      en:
        - "Compensated income 25, B at 25, C at 40."
        - "Substitution effect 15, income effect 15."
        - "Identifies a normal good with a reason."

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: A
    concepts: [utility-function, marginal-rate-of-substitution]
    question:
      zh: |-
        判断真假并说明理由：对效用函数 $U$ 做严格递增的变换 $V = f(U)$ 后，边际效用变了，所以消费者在同样的价格和收入下的最优选择也会改变。
      en: |-
        Determine whether this statement is true or false, and explain: after a strictly increasing transformation $V = f(U)$ of a utility function $U$, the marginal utilities change, so the consumer's best choice at the same prices and income changes too.
    answer:
      zh: |-
        假。边际效用确实变了：$\frac{\partial V}{\partial x} = f'(U)\,MU_x$，$\frac{\partial V}{\partial y} = f'(U)\,MU_y$。但边际替代率是两者之比，$f'(U) > 0$ 约掉了：$MRS_V = \frac{f'(U)\,MU_x}{f'(U)\,MU_y} = MRS_U$。无差异曲线和最优条件 $MRS = \frac{p_x}{p_y}$ 都不变，所以最优选择不变。这正说明边际效用的大小本身没有意义，有意义的是 MRS。
      en: |-
        False. The marginal utilities do change: $\frac{\partial V}{\partial x} = f'(U)\,MU_x$ and $\frac{\partial V}{\partial y} = f'(U)\,MU_y$. But the marginal rate of substitution is their ratio, and $f'(U) > 0$ cancels: $MRS_V = \frac{f'(U)\,MU_x}{f'(U)\,MU_y} = MRS_U$. The indifference curves and the optimality condition $MRS = \frac{p_x}{p_y}$ are unchanged, so the best choice is unchanged. This shows that the size of marginal utility has no meaning by itself; what matters is the MRS.
    rubric:
      zh:
        - "结论为假。"
        - "用链式法则说明 $f'(U)$ 在 MRS 中约掉，或说明无差异曲线不变。"
      en:
        - "States false."
        - "Uses the chain rule to show that $f'(U)$ cancels in the MRS, or explains that the indifference curves do not change."

  - id: Q2
    kind: exercise
    level: B
    concepts: [marginal-rate-of-substitution, indifference-curve, budget-constraint]
    expected: { x: "10", y: "10" }
    question:
      zh: |-
        效用函数 $U = x^{0.3} y^{0.7}$。
        (a) 求边际替代率。沿着一条无差异曲线，$x$ 增加时 MRS 怎样变化？这说明了无差异曲线的什么形状？
        (b) $p_x = 3$，$p_y = 7$，$M = 100$。用相切条件求最优选择。花在 $x$ 上的钱占预算的比例是多少？
      en: |-
        The utility function is $U = x^{0.3} y^{0.7}$.
        (a) Find the marginal rate of substitution. Along an indifference curve, how does the MRS change as $x$ rises? What does this say about the shape of the indifference curve?
        (b) $p_x = 3$, $p_y = 7$ and $M = 100$. Use the tangency condition to find the best choice. What share of the budget is spent on $x$?
    answer:
      zh: |-
        (a) $MU_x = 0.3\,x^{-0.7}y^{0.7}$，$MU_y = 0.7\,x^{0.3}y^{-0.3}$，$MRS = \frac{0.3}{0.7} \cdot \frac{y}{x}$。沿着无差异曲线，$x$ 增加时 $y$ 减少，$\frac{y}{x}$ 下降，MRS 递减：无差异曲线凸向原点。
        (b) $\frac{0.3}{0.7} \cdot \frac{y}{x} = \frac{3}{7}$，得 $y = x$。代入 $3x + 7y = 100$，$x = y = 10$。花在 $x$ 上的钱是 30 美元，占 30%，正好等于 $x$ 的指数 0.3。
      en: |-
        (a) $MU_x = 0.3\,x^{-0.7}y^{0.7}$ and $MU_y = 0.7\,x^{0.3}y^{-0.3}$, so $MRS = \frac{0.3}{0.7} \cdot \frac{y}{x}$. Along an indifference curve, $y$ falls as $x$ rises, so $\frac{y}{x}$ falls and the MRS diminishes: the indifference curve bows toward the origin.
        (b) $\frac{0.3}{0.7} \cdot \frac{y}{x} = \frac{3}{7}$ gives $y = x$. The budget $3x + 7y = 100$ then gives $x = y = 10$. Spending on $x$ is 30 dollars, 30% of the budget, exactly the exponent of $x$, 0.3.
    rubric:
      zh:
        - "(a) MRS 的表达式正确，说明递减和凸向原点。"
        - "(b) $x = y = 10$，支出比例 30%。"
      en:
        - "(a) The MRS is correct, and its decline and the bowed shape are explained."
        - "(b) $x = y = 10$, a spending share of 30%."

  - id: Q3
    kind: exercise
    level: B
    concepts: [corner-solution, indifference-curve, demand]
    expected: { y: "30", x: "20", pstar: "2" }
    question:
      zh: |-
        某人认为 1 单位 $x$ 和 2 单位 $y$ 一样好：$U = 2x + y$。预算 $M = 30$，$p_y = 1$。
        (a) $p_x = 3$ 时，他买多少 $x$ 和 $y$？
        (b) $p_x$ 降到 1.5 时呢？
        (c) $p_x$ 在什么价格以上他完全不买 $x$？画出他对 $x$ 的需求曲线的形状。为什么相切条件在这里帮不上忙？
      en: |-
        Someone considers 1 unit of $x$ as good as 2 units of $y$: $U = 2x + y$. The budget is $M = 30$ and $p_y = 1$.
        (a) At $p_x = 3$, how much $x$ and $y$ does he buy?
        (b) What if $p_x$ falls to 1.5?
        (c) Above what price of $x$ does he buy no $x$ at all? Sketch the shape of his demand curve for $x$. Why is the tangency condition of no help here?
    answer:
      zh: |-
        比较每 1 美元带来的效用：$x$ 为 $\frac{2}{p_x}$，$y$ 为 $\frac{1}{p_y} = 1$。
        (a) $p_x = 3$ 时 $x$ 每美元带来 $\frac{2}{3} < 1$，全部买 $y$：$y = 30$，$x = 0$。
        (b) $p_x = 1.5$ 时 $\frac{2}{1.5} \approx 1.33 > 1$，全部买 $x$：$x = 20$，$y = 0$。
        (c) $\frac{2}{p_x} < 1$ 即 $p_x > 2$ 时不买 $x$；$p_x < 2$ 时买 $x = \frac{30}{p_x}$；$p_x = 2$ 时两种商品无差别。需求曲线在 $p_x = 2$ 处从 0 跳到 15。
        无差异曲线是斜率为 −2 的直线，MRS 处处等于 2，只有当价格比正好等于 2 时才“相切”（此时整条预算线都是最优）；其他情况下最优点都在角点上。
      en: |-
        Compare the utility per dollar: $\frac{2}{p_x}$ for $x$ and $\frac{1}{p_y} = 1$ for $y$.
        (a) At $p_x = 3$, a dollar on $x$ gives $\frac{2}{3} < 1$, so he spends everything on $y$: $y = 30$ and $x = 0$.
        (b) At $p_x = 1.5$, $\frac{2}{1.5} \approx 1.33 > 1$, so he spends everything on $x$: $x = 20$ and $y = 0$.
        (c) He buys no $x$ when $\frac{2}{p_x} < 1$, that is, $p_x > 2$; when $p_x < 2$ he buys $x = \frac{30}{p_x}$; at $p_x = 2$ the two goods are equally good per dollar. The demand curve jumps from 0 to 15 at $p_x = 2$.
        The indifference curves are straight lines with slope −2, so the MRS equals 2 everywhere. They "touch" the budget line only when the price ratio is exactly 2 (then the whole budget line is optimal); otherwise the optimum is at a corner.
    rubric:
      zh:
        - "(a) 只买 $y$，$y = 30$；(b) 只买 $x$，$x = 20$。"
        - "(c) 临界价格 2，需求曲线在此处跳跃。"
        - "说明 MRS 为常数，最优点通常是角点。"
      en:
        - "(a) Only $y$, $y = 30$; (b) only $x$, $x = 20$."
        - "(c) The critical price is 2, where the demand curve jumps."
        - "Explains that the MRS is constant and the optimum is usually a corner."

  - id: Q4
    kind: exercise
    level: C
    star: true
    concepts: [slutsky-equation, substitution-effect, income-effect]
    question:
      zh: |-
        推导 Slutsky 方程。设 $x(p_x, M)$ 是需求函数（$p_y$ 固定），原来的价格为 $p_0$，原来的选择为 $x_0 = x(p_0, M_0)$。Slutsky 补偿后的需求是
        $$x^s(p_x) = x\big(p_x,\; M_0 + x_0\,(p_x - p_0)\big)$$
        (a) 解释括号里的第二项为什么是补偿后的收入。
        (b) 对 $p_x$ 求导，并在 $p_x = p_0$ 处取值，推出 $\frac{\partial x}{\partial p_x} = \frac{\partial x^s}{\partial p_x} - x\,\frac{\partial x}{\partial M}$。
        (c) 用这个方程说明：为什么一种商品要成为吉芬商品，它必须是劣等品，而且通常要在消费者的支出中占很大比例？
      en: |-
        Derive the Slutsky equation. Let $x(p_x, M)$ be the demand function ($p_y$ fixed), $p_0$ the original price and $x_0 = x(p_0, M_0)$ the original choice. Demand after Slutsky compensation is
        $$x^s(p_x) = x\big(p_x,\; M_0 + x_0\,(p_x - p_0)\big)$$
        (a) Explain why the second argument is the compensated income.
        (b) Differentiate with respect to $p_x$ and evaluate at $p_x = p_0$ to obtain $\frac{\partial x}{\partial p_x} = \frac{\partial x^s}{\partial p_x} - x\,\frac{\partial x}{\partial M}$.
        (c) Use this equation to explain why a good can be a Giffen good only if it is inferior, and why it usually must take a large share of the consumer's spending.
    answer:
      zh: |-
        (a) 价格从 $p_0$ 变为 $p_x$ 后，要买得起原来的组合，买 $x_0$ 单位 $x$ 需要多花 $x_0(p_x - p_0)$（$y$ 的价格不变），所以收入要调整为 $M_0 + x_0(p_x - p_0)$。
        (b) 由链式法则，$\frac{dx^s}{dp_x} = \frac{\partial x}{\partial p_x} + \frac{\partial x}{\partial M} \cdot x_0$。在 $p_x = p_0$ 处，补偿后的收入就是 $M_0$，$x = x_0$，移项得 $\frac{\partial x}{\partial p_x} = \frac{\partial x^s}{\partial p_x} - x\,\frac{\partial x}{\partial M}$。
        (c) 替代效应 $\frac{\partial x^s}{\partial p_x} \le 0$。要使 $\frac{\partial x}{\partial p_x} > 0$，必须 $-x\,\frac{\partial x}{\partial M} > 0$ 且足够大，即 $\frac{\partial x}{\partial M} < 0$（劣等品）。收入效应的大小与 $x$ 成正比：这种商品买得越多（支出占比越大），价格变化对实际收入的影响越大，收入效应才可能超过替代效应。
      en: |-
        (a) When the price changes from $p_0$ to $p_x$, buying the original $x_0$ units of $x$ costs $x_0(p_x - p_0)$ more (the price of $y$ is unchanged), so income must be adjusted to $M_0 + x_0(p_x - p_0)$ to keep the original bundle affordable.
        (b) By the chain rule, $\frac{dx^s}{dp_x} = \frac{\partial x}{\partial p_x} + \frac{\partial x}{\partial M} \cdot x_0$. At $p_x = p_0$ the compensated income is $M_0$ and $x = x_0$; rearranging gives $\frac{\partial x}{\partial p_x} = \frac{\partial x^s}{\partial p_x} - x\,\frac{\partial x}{\partial M}$.
        (c) The substitution effect is $\frac{\partial x^s}{\partial p_x} \le 0$. For $\frac{\partial x}{\partial p_x} > 0$, the term $-x\,\frac{\partial x}{\partial M}$ must be positive and large enough, which requires $\frac{\partial x}{\partial M} < 0$ (an inferior good). The income effect is proportional to $x$: the more of the good the consumer buys (the larger its share of spending), the more a price change affects real income, and only then can the income effect outweigh the substitution effect.
    rubric:
      zh:
        - "(a) 说明多花的钱是 $x_0(p_x - p_0)$。"
        - "(b) 正确使用链式法则并在原价格处取值。"
        - "(c) 指出需要劣等品，且收入效应与 $x$ 成正比。"
      en:
        - "(a) Explains that the extra cost is $x_0(p_x - p_0)$."
        - "(b) Uses the chain rule correctly and evaluates at the original price."
        - "(c) Points out that an inferior good is needed and that the income effect is proportional to $x$."

  - id: Q5
    kind: exercise
    level: B
    concepts: [substitution-effect, income-effect]
    expected: { x: "10", mc: "60", xs: "15", se: "5", ie: "-5" }
    question:
      zh: |-
        $U = xy$，$M = 40$，$p_x = 2$。$y$ 的价格从 1 涨到 2。
        (a) $x$ 的需求量变化多少？
        (b) 对 $x$ 做 Slutsky 分解：补偿收入是多少？替代效应和收入效应各是多少？
        (c) 用 (b) 解释为什么这个消费者对 $x$ 的需求与 $p_y$ 无关。
      en: |-
        $U = xy$, $M = 40$ and $p_x = 2$. The price of $y$ rises from 1 to 2.
        (a) How much does the quantity demanded of $x$ change?
        (b) Apply the Slutsky decomposition to $x$: what is the compensated income? How large are the substitution effect and the income effect?
        (c) Use (b) to explain why this consumer's demand for $x$ does not depend on $p_y$.
    answer:
      zh: |-
        (a) $x = \frac{M}{2p_x} = 10$，与 $p_y$ 无关，变化为 0。
        (b) 原来的组合是 $x = 10$，$y = 20$。补偿收入 $M' = 2 \times 10 + 2 \times 20 = 60$，B：$x = \frac{60}{2 \times 2} = 15$。替代效应 $15 - 10 = 5$（$y$ 相对变贵，用 $x$ 替代 $y$），收入效应 $10 - 15 = -5$（实际收入下降，$x$ 是正常品，买得更少）。
        (c) 对这个效用函数，$p_y$ 上升时的替代效应和收入效应大小相等、方向相反，正好抵消。
      en: |-
        (a) $x = \frac{M}{2p_x} = 10$, which does not depend on $p_y$; the change is 0.
        (b) The original bundle is $x = 10$, $y = 20$. Compensated income $M' = 2 \times 10 + 2 \times 20 = 60$, and B has $x = \frac{60}{2 \times 2} = 15$. Substitution effect $15 - 10 = 5$ ($y$ is relatively more expensive, so $x$ replaces some $y$); income effect $10 - 15 = -5$ (real income falls and $x$ is a normal good, so less of it is bought).
        (c) For this utility function, the substitution and income effects of a rise in $p_y$ are equal in size and opposite in direction, so they cancel exactly.
    rubric:
      zh:
        - "(a) 变化为 0。"
        - "(b) 补偿收入 60，替代效应 +5，收入效应 −5。"
        - "(c) 两个效应抵消。"
      en:
        - "(a) No change."
        - "(b) Compensated income 60, substitution effect +5, income effect −5."
        - "(c) The two effects cancel."

  - id: Q6
    kind: exercise
    level: B
    concepts: [giffen-good, slutsky-equation, income-effect]
    expected: { ie: "4.5", total: "2.5" }
    question:
      zh: |-
        一个低收入家庭每月买 60 公斤米，米是这个家庭最主要的支出。研究者估计：米价每公斤上涨 0.5 美元时，替代效应使米的需求量减少 2 公斤；这个家庭对米的需求随收入的变化是 $\frac{\partial x}{\partial M} = -0.15$ 公斤 / 美元。
        (a) 用 Slutsky 方程估计收入效应和总效应。
        (b) 对这个家庭来说，米是吉芬商品吗？
        (c) 为什么同样是劣等品，对富裕家庭来说米通常不会是吉芬商品？
      en: |-
        A low-income household buys 60 kg of rice a month; rice is its largest expense. A researcher estimates that when the price of rice rises by 0.5 dollars per kg, the substitution effect lowers the quantity demanded by 2 kg, and that the household's demand for rice changes with income at $\frac{\partial x}{\partial M} = -0.15$ kg per dollar.
        (a) Use the Slutsky equation to estimate the income effect and the total effect.
        (b) Is rice a Giffen good for this household?
        (c) Why is rice usually not a Giffen good for a wealthy household, even though it is an inferior good for it too?
    answer:
      zh: |-
        (a) 收入效应 $= -x\,\frac{\partial x}{\partial M}\,\Delta p = -60 \times (-0.15) \times 0.5 = 4.5$ 公斤。总效应 $= -2 + 4.5 = 2.5$ 公斤：需求量增加 2.5 公斤。
        (b) 是。价格上升时需求量增加，收入效应超过了替代效应。
        (c) 收入效应与购买量 $x$ 成正比。富裕家庭买的米占支出的比例很小，米价上涨对它的实际收入影响很小，收入效应远小于替代效应，需求量仍随价格上升而下降。
      en: |-
        (a) Income effect $= -x\,\frac{\partial x}{\partial M}\,\Delta p = -60 \times (-0.15) \times 0.5 = 4.5$ kg. Total effect $= -2 + 4.5 = 2.5$ kg: the quantity demanded rises by 2.5 kg.
        (b) Yes. The quantity demanded rises when the price rises; the income effect outweighs the substitution effect.
        (c) The income effect is proportional to the quantity bought, $x$. Rice is a small share of a wealthy household's spending, so a higher rice price barely affects its real income; the income effect is much smaller than the substitution effect, and the quantity demanded still falls as the price rises.
    rubric:
      zh:
        - "(a) 收入效应 +4.5 公斤，总效应 +2.5 公斤。"
        - "(b) 是吉芬商品。"
        - "(c) 用支出比例（收入效应与 $x$ 成正比）解释。"
      en:
        - "(a) Income effect +4.5 kg, total effect +2.5 kg."
        - "(b) It is a Giffen good."
        - "(c) Explains with the spending share (the income effect is proportional to $x$)."
