# Answer key for lesson 0.3. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[0.4]] (lesson), [[0.3#covariance]] (section), [[concept:covariance]], [[check:Q4]].
# expected: values are recomputed by course/verify/0.3.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "0.3"

context:
  - zh: |-
      本课所有计算以百分点为单位，方差的单位为 %²。学习者已经学过求和符号，以及[[0.2]]的最优化；还没有学用历史数据估计参数（[[0.4]]）、回归（[[0.5]]）和组合理论（[[4.2]]）。
    en: |-
      All calculations in this lesson use percentage points, and variance is in %². The learner has studied summation notation and the optimization in [[0.2]]. The learner has not yet studied estimating parameters from historical data ([[0.4]]), regression ([[0.5]]) or portfolio theory ([[4.2]]).
  - questions: [C1, C2, C3, C4]
    zh: |-
      讲义中的例子（情景表）：繁荣 / 正常 / 衰退的概率为 0.25 / 0.5 / 0.25；股票 A 的收益为 30 / 10 / −10，债券基金 B 的收益为 1 / 5 / 3（%）。由此 $E[R_A] = 10$，$E[R_B] = 3.5$，$\text{Var}_A = 200$，$\text{Var}_B = 2.75$，$\text{Cov} = -10$，$\rho \approx -0.43$。
    en: |-
      Example from the lesson (scenario table): boom / normal / recession with probabilities 0.25 / 0.5 / 0.25; stock A returns 30 / 10 / −10 and bond fund B returns 1 / 5 / 3 (%). So $E[R_A] = 10$, $E[R_B] = 3.5$, $\text{Var}_A = 200$, $\text{Var}_B = 2.75$, $\text{Cov} = -10$, $\rho \approx -0.43$.
  - questions: [C5]
    zh: |-
      [[fig:6-1]] 是一张交互图：$\sigma_A = 20\%$，$\sigma_B = 10\%$，学习者可以用滑块调整相关系数 $\rho$ 和 A 的权重 $w$，图中显示组合标准差曲线、加权平均线和波动最小点。
    en: |-
      [[fig:6-1]] is an interactive figure with $\sigma_A = 20\%$ and $\sigma_B = 10\%$. The learner can move sliders for the correlation $\rho$ and the weight in A, $w$. It shows the portfolio standard deviation curve, the weighted-average line and the minimum-volatility point.
  - concepts: [expected-value, variance, standard-deviation]
    zh: |-
      期望 $E[R] = \sum_i p_i R_i$；方差 $\text{Var}(R) = \sum_i p_i (R_i - E[R])^2$；标准差是方差的平方根，单位为 %，也叫波动率。
    en: |-
      Expected value $E[R] = \sum_i p_i R_i$. Variance $\text{Var}(R) = \sum_i p_i (R_i - E[R])^2$. The standard deviation is the square root of the variance, in %, and is also called volatility.
  - concepts: [covariance, correlation]
    zh: |-
      协方差 $\text{Cov}(R_A, R_B) = \sum_i p_i (R_{A,i} - E[R_A])(R_{B,i} - E[R_B])$，看的是相对各自期望的偏差是否同向，不是收益的正负。相关系数 $\rho = \text{Cov} / (\sigma_A \sigma_B)$，在 $[-1, 1]$ 之间。
    en: |-
      Covariance $\text{Cov}(R_A, R_B) = \sum_i p_i (R_{A,i} - E[R_A])(R_{B,i} - E[R_B])$ measures whether the deviations from each expected value have the same sign, not whether the returns are positive. Correlation $\rho = \text{Cov} / (\sigma_A \sigma_B)$ lies in $[-1, 1]$.
  - concepts: [portfolio-variance]
    zh: |-
      组合 $R_P = wR_A + (1-w)R_B$：期望是线性的；方差 $w^2\sigma_A^2 + (1-w)^2\sigma_B^2 + 2w(1-w)\text{Cov}$ 不是线性的。
    en: |-
      Portfolio $R_P = wR_A + (1-w)R_B$: the expected value is linear; the variance $w^2\sigma_A^2 + (1-w)^2\sigma_B^2 + 2w(1-w)\text{Cov}$ is not.
  - concepts: [diversification]
    zh: |-
      分散化：只要 $\rho < 1$，组合标准差就小于加权平均。$\rho = 0$ 时好处来自“方差相加、标准差不相加”（$\sqrt{a^2+b^2} < a+b$），不需要负的协方差项。分散化不需要负相关。
    en: |-
      Diversification: as long as $\rho < 1$, the portfolio standard deviation is less than the weighted average. When $\rho = 0$, the benefit comes from "variances add, standard deviations do not" ($\sqrt{a^2+b^2} < a+b$); it does not need a negative covariance term. Diversification does not require negative correlation.

common_errors:
  - questions: [Q1, C5]
    zh: |-
      认为 $\rho = 0$ 时是负的协方差降低了风险：此时协方差项为 0。好处来自方差相加、标准差不相加；等价地说，加权平均对应 $\rho = 1$，而 $\rho = 0$ 时少了正的协方差项。
    en: |-
      Thinking that at $\rho = 0$ a negative covariance lowers the risk: the covariance term is 0 in this case. The benefit comes from the fact that variances add but standard deviations do not; in other words, the weighted average corresponds to $\rho = 1$, and at $\rho = 0$ the positive covariance term is missing.
  - questions: [Q2]
    zh: |-
      认为“两只基金都涨了，所以正相关”：相关看的是相对各自期望的偏差方向，不是收益的正负；而且一次观测说明不了概率关系。
    en: |-
      Saying "both funds went up, so they are positively correlated": correlation is about the direction of deviations from each expected value, not about whether returns are positive. Also, one observation says nothing about a probabilistic relationship.
  - questions: [C2, C4, Q3, Q4]
    zh: |-
      把方差的单位写成 %，或者直接比较方差和期望收益的大小。
    en: |-
      Writing the unit of variance as % instead of %², or comparing a variance directly with an expected return.

questions:
  # ---------- Check questions (随堂题, scored) ----------
  - id: C1
    kind: check
    section: expected-value
    concepts: [expected-value]
    expected: { E_B: "3.5" }
    question:
      zh: |-
        用同样的方法计算 B 的期望收益，写出计算过程。
      en: |-
        Use the same method to calculate the expected return of B. Show the calculation.
    answer:
      zh: |-
        $E[R_B] = 0.25 \times 1 + 0.5 \times 5 + 0.25 \times 3 = 3.5$（%）。
      en: |-
        $E[R_B] = 0.25 \times 1 + 0.5 \times 5 + 0.25 \times 3 = 3.5$ (%).
    rubric:
      zh:
        - "按概率加权求和，过程完整。"
      en:
        - "Computes the probability-weighted sum and shows each term."

  - id: C2
    kind: check
    section: variance
    concepts: [expected-value, variance, standard-deviation]
    expected: { E_new: "15" }
    question:
      zh: |-
        如果 A 在每种情景下的收益都加 5 个百分点，期望和标准差分别怎么变？为什么？
      en: |-
        If A's return in every scenario increases by 5 percentage points, how do its expected value and standard deviation change? Why?
    answer:
      zh: |-
        期望增加 5 个百分点，变为 15%。标准差不变，因为每种情景的偏差 $R_i - E[R]$ 都没有变。
      en: |-
        The expected value increases by 5 percentage points to 15%. The standard deviation does not change, because the deviation $R_i - E[R]$ in every scenario stays the same.
    rubric:
      zh:
        - "期望的变化正确。"
        - "标准差不变，并用“偏差不变”说明理由。"
      en:
        - "The change in the expected value is correct."
        - "States that the standard deviation is unchanged and gives the reason: the deviations do not change."

  - id: C3
    kind: check
    section: covariance
    concepts: [covariance]
    expected: { E_B_new: "4.75", cov_new: "-35" }
    question:
      zh: |-
        如果把 B 在衰退时的收益从 3% 改为 8%（其他不变），协方差会变大还是变小？先凭直觉判断，再计算验证。
      en: |-
        If B's return in the recession scenario changes from 3% to 8% (everything else unchanged), does the covariance become larger or smaller? First judge by intuition, then verify by calculation.
    answer:
      zh: |-
        变得更负（变小）。直觉：衰退时 A 远低于期望，B 改为 8% 后 B 在衰退时高于期望，二者反向，贡献负值。
        计算：B 的新期望为 4.75%，偏差为 −3.75、+0.25、+3.25；
        $\text{Cov} = 0.25(20)(-3.75) + 0.5(0)(0.25) + 0.25(-20)(3.25) = -35$。
      en: |-
        It becomes more negative (smaller). Intuition: in the recession A is far below its expected value; after the change, B is above its expected value in the recession, so the two move in opposite directions and the contribution is negative.
        Calculation: B's new expected value is 4.75%, and its deviations are −3.75, +0.25 and +3.25;
        $\text{Cov} = 0.25(20)(-3.75) + 0.5(0)(0.25) + 0.25(-20)(3.25) = -35$.
    rubric:
      zh:
        - "注意到 B 的期望也随之改变，并重新计算了偏差。"
        - "协方差数值正确。"
        - "直觉判断用偏差的方向来解释。"
      en:
        - "Notices that B's expected value also changes and recomputes the deviations."
        - "The covariance value is correct."
        - "The intuitive judgment is explained with the direction of the deviations."

  - id: C4
    kind: check
    section: linear-combination
    concepts: [portfolio-variance]
    expected: { E_P: "8.7", var_P: "124.91", sd_P: "11.18" }
    question:
      zh: |-
        A 占 80%、B 占 20% 时，组合的期望和标准差是多少？
      en: |-
        With 80% in A and 20% in B, what are the portfolio's expected value and standard deviation?
    answer:
      zh: |-
        $E[R_P] = 0.8 \times 10 + 0.2 \times 3.5 = 8.7$（%）。
        $\text{Var} = 0.64 \times 200 + 0.04 \times 2.75 + 2 \times 0.8 \times 0.2 \times (-10) = 124.91$（%²），$\sigma_P \approx 11.18$%。
      en: |-
        $E[R_P] = 0.8 \times 10 + 0.2 \times 3.5 = 8.7$ (%).
        $\text{Var} = 0.64 \times 200 + 0.04 \times 2.75 + 2 \times 0.8 \times 0.2 \times (-10) = 124.91$ (%²), so $\sigma_P \approx 11.18$%.
    rubric:
      zh:
        - "期望正确。"
        - "方差公式三项齐全，协方差项带系数 2。"
        - "标准差正确，单位正确。"
      en:
        - "The expected value is correct."
        - "All three terms of the variance formula are present, with the factor 2 on the covariance term."
        - "The standard deviation and its unit are correct."

  - id: C5
    kind: check
    section: diversification
    concepts: [diversification, portfolio-variance]
    widget: { id: diversification, set: { rho: 0 } }
    expected: { w_A: "20", sd_min: "8.94" }
    question:
      zh: |-
        把 $\rho$ 调到 0，找出组合标准差最小的大致权重。这时组合的标准差比 B 自己的 10% 还小吗？这说明了什么？
      en: |-
        Set $\rho$ to 0 and find the approximate weight that minimizes the portfolio standard deviation. Is the portfolio standard deviation then smaller than B's own 10%? What does this show?
    answer:
      zh: |-
        $\rho = 0$ 时 $w_A = \frac{\sigma_B^2}{\sigma_A^2 + \sigma_B^2} = 20$%，$\sigma_P = \sqrt{80} \approx 8.94$% $< 10$%。
        说明不相关的资产也能分散风险：在低波动的 B 中加入一部分波动更高的 A，组合的总风险反而下降。
      en: |-
        At $\rho = 0$, $w_A = \frac{\sigma_B^2}{\sigma_A^2 + \sigma_B^2} = 20$%, and $\sigma_P = \sqrt{80} \approx 8.94$% $< 10$%.
        This shows that uncorrelated assets also diversify risk: adding some of the more volatile A to the low-volatility B lowers the total risk of the portfolio.
    rubric:
      zh:
        - "最小方差权重约为 20%。"
        - "标准差约 8.9%，小于 10%。"
        - "结论指出不相关也能分散，或加入高波动资产反而降低风险。"
      en:
        - "The minimum-variance weight is about 20%."
        - "The standard deviation is about 8.9%, which is less than 10%."
        - "The conclusion states that uncorrelated assets also diversify, or that adding a more volatile asset can lower risk."

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: A
    concepts: [diversification, covariance]
    question:
      zh: |-
        判断真假并说明理由：两项资产的相关系数为 0 时，组合标准差等于两者标准差的加权平均。
      en: |-
        Determine whether this statement is true or false, and explain: when the correlation between two assets is 0, the portfolio standard deviation equals the weighted average of their standard deviations.
    answer:
      zh: |-
        假。$\rho = 0$ 时协方差项为 0，$\sigma_P = \sqrt{w^2\sigma_A^2 + (1-w)^2\sigma_B^2} < w\sigma_A + (1-w)\sigma_B$，因为对正数 $a, b$ 有 $\sqrt{a^2+b^2} < a+b$。
      en: |-
        False. When $\rho = 0$ the covariance term is 0, and $\sigma_P = \sqrt{w^2\sigma_A^2 + (1-w)^2\sigma_B^2} < w\sigma_A + (1-w)\sigma_B$, because $\sqrt{a^2+b^2} < a+b$ for positive $a, b$.
    rubric:
      zh:
        - "结论为假。"
        - "理由正确：例如证明对正数 $a, b$ 有 $\\sqrt{a^2+b^2} < a+b$（方差相加、标准差不相加），或指出加权平均对应 $\\rho = 1$，而 $\\rho = 0$ 时少了正的协方差项。"
        - "如果把理由说成“负的协方差降低了风险”，需要订正：$\\rho = 0$ 时协方差项为 0。"
      en:
        - "States false."
        - "The reason is correct: for example, a proof that $\\sqrt{a^2+b^2} < a+b$ for positive $a, b$ (variances add, standard deviations do not), or the observation that the weighted average corresponds to $\\rho = 1$, and at $\\rho = 0$ the positive covariance term is missing."
        - "A reason saying that \"a negative covariance lowers the risk\" needs to be revised: at $\\rho = 0$ the covariance term is 0."

  - id: Q2
    kind: exercise
    level: A
    concepts: [correlation, covariance]
    question:
      zh: |-
        一位朋友说：“这两只基金去年都涨了，所以它们的相关系数一定是正的。”评估这个说法。
      en: |-
        A friend says: "Both of these funds went up last year, so their correlation must be positive." Evaluate this statement.
    answer:
      zh: |-
        不对。(1) 相关系数看的是相对各自期望的偏差方向，不是收益是否同为正：两只基金期望都是 8%，一只涨 15%、一只涨 2%，这一年对协方差的贡献是负的。(2) 一年只是一个观测点，样本太小，说明不了概率关系（[[0.4]] 会讲怎样从数据估计）。
      en: |-
        No. (1) Correlation depends on the direction of deviations from each expected value, not on whether both returns are positive. If both funds have an expected return of 8% and one rises 15% while the other rises 2%, this year contributes a negative amount to the covariance. (2) One year is a single observation; the sample is too small to show a probabilistic relationship ([[0.4]] covers how to estimate from data).
    rubric:
      zh:
        - "指出相关看偏差而不是收益的正负。"
        - "指出一次观测 / 样本太小。两点都要有。"
      en:
        - "Points out that correlation is about deviations, not about the sign of returns."
        - "Points out that one observation is too small a sample. Both points are required."

  - id: Q3
    kind: exercise
    level: B
    concepts: [expected-value, variance, standard-deviation, covariance, correlation]
    expected: { E_C: "7.7", sd_C: "13.56", E_D: "4.5", sd_D: "6.70", cov_CD: "-88.95", rho_CD: "-0.98" }
    question:
      zh: |-
        三种情景概率为 0.3、0.4、0.3；资产 C 收益为 25、8、−10（%），资产 D 收益为 −5、6、12（%）。计算两者的期望、标准差、协方差和相关系数。
      en: |-
        Three scenarios have probabilities 0.3, 0.4 and 0.3. Asset C returns 25, 8 and −10 (%), and asset D returns −5, 6 and 12 (%). Calculate the expected value and standard deviation of each asset, their covariance and their correlation.
    answer:
      zh: |-
        $E[C] = 7.7$，$\sigma_C \approx 13.56$；$E[D] = 4.5$，$\sigma_D \approx 6.70$；$\text{Cov} = -88.95$（%²）；$\rho \approx -0.98$。
      en: |-
        $E[C] = 7.7$ and $\sigma_C \approx 13.56$; $E[D] = 4.5$ and $\sigma_D \approx 6.70$; $\text{Cov} = -88.95$ (%²); $\rho \approx -0.98$.
    rubric:
      zh:
        - "两个期望、两个标准差、协方差和相关系数都正确。"
        - "计算过程必须写出，以便指出出错的步骤。"
      en:
        - "Both expected values, both standard deviations, the covariance and the correlation are correct."
        - "The working must be shown, so that the step with an error can be identified."

  - id: Q4
    kind: exercise
    level: B
    concepts: [portfolio-variance, diversification]
    expected: { var_P: "140.70", sd_P: "11.86", wavg: "14" }
    question:
      zh: |-
        $\sigma_A = 18\%$，$\sigma_B = 8\%$，$\rho = 0.2$，权重 60% / 40%。计算组合标准差，并与加权平均比较。
      en: |-
        $\sigma_A = 18\%$, $\sigma_B = 8\%$, $\rho = 0.2$, and the weights are 60% / 40%. Calculate the portfolio standard deviation and compare it with the weighted average.
    answer:
      zh: |-
        $\text{Var} = 0.36 \times 324 + 0.16 \times 64 + 2 \times 0.6 \times 0.4 \times 0.2 \times 18 \times 8 = 140.70$（%²），$\sigma_P \approx 11.86$%；加权平均为 14%，组合标准差更低。
      en: |-
        $\text{Var} = 0.36 \times 324 + 0.16 \times 64 + 2 \times 0.6 \times 0.4 \times 0.2 \times 18 \times 8 = 140.70$ (%²), so $\sigma_P \approx 11.86$%. The weighted average is 14%, so the portfolio standard deviation is lower.
    rubric:
      zh:
        - "方差三项正确。"
        - "求出标准差，并与加权平均比较。"
      en:
        - "All three variance terms are correct."
        - "Finds the standard deviation and compares it with the weighted average."

  - id: Q5
    kind: exercise
    level: C
    star: true
    concepts: [portfolio-variance, expected-value, variance, covariance]
    question:
      zh: |-
        证明 $\text{Var}(aX + bY) = a^2\text{Var}(X) + b^2\text{Var}(Y) + 2ab\,\text{Cov}(X, Y)$。
      en: |-
        Prove that $\text{Var}(aX + bY) = a^2\text{Var}(X) + b^2\text{Var}(Y) + 2ab\,\text{Cov}(X, Y)$.
    answer:
      zh: |-
        由期望的线性，$E[aX + bY] = aE[X] + bE[Y]$。记 $\tilde X = X - E[X]$，$\tilde Y = Y - E[Y]$，则
        $$\text{Var}(aX+bY) = E\big[(a\tilde X + b\tilde Y)^2\big] = a^2E[\tilde X^2] + b^2E[\tilde Y^2] + 2abE[\tilde X\tilde Y],$$
        即 $a^2\text{Var}(X) + b^2\text{Var}(Y) + 2ab\,\text{Cov}(X, Y)$。
      en: |-
        By linearity of expectation, $E[aX + bY] = aE[X] + bE[Y]$. Let $\tilde X = X - E[X]$ and $\tilde Y = Y - E[Y]$. Then
        $$\text{Var}(aX+bY) = E\big[(a\tilde X + b\tilde Y)^2\big] = a^2E[\tilde X^2] + b^2E[\tilde Y^2] + 2abE[\tilde X\tilde Y],$$
        which equals $a^2\text{Var}(X) + b^2\text{Var}(Y) + 2ab\,\text{Cov}(X, Y)$.
    rubric:
      zh:
        - "使用期望的线性那一步要写出理由。"
        - "正确展开平方，并逐项识别为方差和协方差。"
      en:
        - "The step that uses linearity of expectation must be justified."
        - "Expands the square correctly and identifies each term as a variance or covariance."

  - id: Q6
    kind: exercise
    level: C
    concepts: [portfolio-variance, correlation]
    expected: { w: "30.8" }
    question:
      zh: |-
        若 $\rho = -1$，求使组合方差为 0 的权重 $w$（用 $\sigma_A, \sigma_B$ 表示），并代入 [[check:Q4]] 的 $\sigma_A, \sigma_B$ 求数值。
      en: |-
        If $\rho = -1$, find the weight $w$ that makes the portfolio variance 0 (in terms of $\sigma_A$ and $\sigma_B$), and then compute its value using $\sigma_A$ and $\sigma_B$ from [[check:Q4]].
    answer:
      zh: |-
        $\rho = -1$ 时 $\sigma_P^2 = \big(w\sigma_A - (1-w)\sigma_B\big)^2$，令其为 0 得 $w = \frac{\sigma_B}{\sigma_A + \sigma_B} = \frac{8}{26} \approx 30.8$%。$w$ 自动在 0 与 1 之间，不需要卖空。
      en: |-
        When $\rho = -1$, $\sigma_P^2 = \big(w\sigma_A - (1-w)\sigma_B\big)^2$. Setting it to 0 gives $w = \frac{\sigma_B}{\sigma_A + \sigma_B} = \frac{8}{26} \approx 30.8$%. The weight is automatically between 0 and 1, so no short selling is needed.
    rubric:
      zh:
        - "写出 $\\rho = -1$ 时方差为完全平方，或等价推导。"
        - "得出公式与数值。"
      en:
        - "Shows that the variance is a perfect square when $\\rho = -1$, or an equivalent derivation."
        - "Obtains the formula and the value."

  - id: Q7
    kind: exercise
    level: C
    concepts: [portfolio-variance, diversification]
    question:
      zh: |-
        等权持有 $n$ 只股票，每只方差都是 $\sigma^2$，任意两只之间的协方差都是 $c$（$c > 0$）。求组合方差，讨论 $n \to \infty$ 时的极限，并解释其投资含义。
      en: |-
        You hold $n$ stocks with equal weights. Each has variance $\sigma^2$, and the covariance between any two is $c$ ($c > 0$). Find the portfolio variance, discuss its limit as $n \to \infty$, and explain what it means for investing.
    answer:
      zh: |-
        $\text{Var} = \frac{1}{n^2}\big(n\sigma^2 + (n^2 - n)c\big) = \frac{\sigma^2}{n} + \left(1 - \frac{1}{n}\right)c \to c$。
        个股自己的风险（$\sigma^2/n$ 项）可以分散掉；所有股票共同的风险 $c$ 分散不掉（[[concept:systematic-risk]]，[[4.5]] 详细讲）。
      en: |-
        $\text{Var} = \frac{1}{n^2}\big(n\sigma^2 + (n^2 - n)c\big) = \frac{\sigma^2}{n} + \left(1 - \frac{1}{n}\right)c \to c$.
        The risk specific to each stock (the $\sigma^2/n$ term) can be diversified away; the risk common to all stocks, $c$, cannot ([[concept:systematic-risk]], covered in [[4.5]]).
    rubric:
      zh:
        - "交叉项个数为 $n^2 - n$。"
        - "极限正确。"
        - "含义要区分“能分散的”和“不能分散的”。"
      en:
        - "The number of cross terms is $n^2 - n$."
        - "The limit is correct."
        - "The interpretation distinguishes the risk that can be diversified from the risk that cannot."
