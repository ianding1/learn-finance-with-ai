# Answer key for quiz E0 (math and statistics tools, lessons 0.1–0.5). Shown to learners only inside the
# generated scoring prompt. The quiz page shows only the questions and their points.
# easy_points / hard_points: points of the parts of a question with difficulty score 2 or less / 6 or more
# (scored per part). The quiz has at most 20 easy points and at least 10 hard points. Not shown on the page.
# expected: values are recomputed by course/verify/E0.py in CI and must appear verbatim in every answer text.
# Each question tests a different idea; the parts of a problem build on each other.

lesson: "E0"

context:
  - zh-cn: |-
      测验 E0 考 [[0.1]] 到 [[0.5]]：货币时间价值、优化、概率与组合方差、分布与统计推断、回归。学习者可以用计算器或代码，卷首有公式表（年金、永续年金、EAR、一阶条件、组合方差、标准误、对数正态分布的中位数和均值、OLS、遗漏变量等）。计算用 1.96 作为 95% 的临界值，除非题目另有说明。
    en: |-
      Quiz E0 covers [[0.1]] to [[0.5]]: time value of money, optimization, probability and portfolio variance, distributions and inference, and regression. The learner may use a calculator or code, and the quiz starts with a formula sheet (annuities, perpetuities, EAR, first-order conditions, portfolio variance, standard error, the median and mean of a lognormal distribution, OLS, omitted variables and so on). Calculations use 1.96 as the 95% critical value unless a question says otherwise.

common_errors:
  - questions: [Q4]
    zh-cn: |-
      用两个置信区间是否重叠来判断差异是否显著：应检验两者之差，独立时差的标准误是 $\sqrt{\text{SE}_A^2 + \text{SE}_B^2}$，小于两个标准误之和。
    en: |-
      Judging whether a difference is significant by whether the two confidence intervals overlap: the difference itself must be tested, and with independent estimates its standard error is $\sqrt{\text{SE}_A^2 + \text{SE}_B^2}$, smaller than the sum of the two standard errors.
  - questions: [Q5]
    zh-cn: |-
      认为 $x$ 对 $y$ 回归的斜率是 $y$ 对 $x$ 回归斜率的倒数：只有 $R^2 = 1$ 时才成立，一般两个斜率的乘积等于 $R^2$。
    en: |-
      Thinking that the slope of $x$ on $y$ is the reciprocal of the slope of $y$ on $x$: this holds only when $R^2 = 1$; in general the product of the two slopes is $R^2$.
  - questions: [Q6]
    zh-cn: |-
      每年取款、按月复利时直接用名义年利率 6% 作为年折现率：应先换算成有效年利率。另一个常见错误是忽略第一笔在退休当天取出（期初年金、期初开始的增长永续年金）。
    en: |-
      Using the nominal rate of 6% as the annual discount rate for yearly withdrawals with monthly compounding: it must first be converted to the effective annual rate. Another common error is ignoring that the first withdrawal is on the day of retirement (an annuity due, and a growing perpetuity that starts now).
  - questions: [Q7]
    zh-cn: |-
      把市场价格当作不变（$MR = p$）；或者只看一阶条件，不比较“完全不生产”（$q = 0$）这个边界上的利润。
    en: |-
      Treating the market price as fixed ($MR = p$); or using only the first-order condition without comparing the profit at the boundary of not producing at all ($q = 0$).
  - questions: [Q8]
    zh-cn: |-
      直接接受一阶条件给出的负权重：不能卖空时权重必须在 0 和 1 之间，这时最优解在边界上。(b) 中保留了需要卖空 A 的根 $\rho = 0.875$。
    en: |-
      Accepting the negative weight given by the first-order condition: without short selling the weight must be between 0 and 1, and the optimum is then at the boundary. In (b), keeping the root $\rho = 0.875$, which needs a short position in A.
  - questions: [Q9]
    zh-cn: |-
      把多年对数收益率之和的标准差算成一年的 $n$ 倍（或由多年反推一年时除以 $n$）：各年独立时方差是 $n$ 倍，标准差只是 $\sqrt{n}$ 倍。
    en: |-
      Taking the standard deviation of the sum of several years of log returns as $n$ times that of one year (or dividing by $n$ when working back to one year): with independent years the variance is $n$ times as large, so the standard deviation is only $\sqrt{n}$ times as large.
  - questions: [Q10]
    zh-cn: |-
      把截距理解为“基金比市场多赚的部分”：基金与市场之差是 $a + (b - 1)x$，斜率不等于 1 时取决于市场收益。另一个常见错误是把回归直线当作每个月都成立，忽略残差。
    en: |-
      Reading the intercept as "how much the fund beats the market": the difference between fund and market is $a + (b - 1)x$, which depends on the market return when the slope is not 1. Another common error is treating the regression line as holding every month and ignoring the residuals.

questions:
  # ---------- Part 1: true or false (4 points each) ----------
  - id: Q1
    kind: quiz
    part: judge
    easy_points: 0
    hard_points: 0
    points: 4
    concepts: [present-value, discount-factor]
    expected: { a5: "122.78", b5: "120.94", a10: "77.11", b10: "105.18" }
    question:
      zh-cn: |-
        在 5% 的折现率下，项目 A 的现值高于项目 B。两个项目都只有未来的正现金流。那么在 10% 的折现率下，A 的现值也一定高于 B。
      en: |-
        At a discount rate of 5%, project A has a higher present value than project B. Both projects have only positive future cash flows. Then at a discount rate of 10%, A must also have a higher present value than B.
    answer:
      zh-cn: |-
        假。折现率上升时，越晚到的现金流现值下降得越多（折现因子 $(1+r)^{-t}$ 对 $r$ 的敏感度随 $t$ 增大）。所以现金流较晚的项目在高折现率下可能被反超。
        反例：A 在第 10 年末付 200 美元，B 在第 3 年末付 140 美元。5% 时 A 的现值 $\frac{200}{1.05^{10}} \approx 122.78$，B 的现值 $\frac{140}{1.05^{3}} \approx 120.94$，A 更高；10% 时 A 的现值 $\frac{200}{1.1^{10}} \approx 77.11$，B 的现值 $\frac{140}{1.1^{3}} \approx 105.18$，B 更高。
      en: |-
        False. When the discount rate rises, later cash flows lose more present value (the sensitivity of the discount factor $(1+r)^{-t}$ to $r$ grows with $t$). So a project with later cash flows can fall behind at a higher discount rate.
        Counterexample: A pays 200 dollars at the end of year 10, and B pays 140 dollars at the end of year 3. At 5%, A is worth $\frac{200}{1.05^{10}} \approx 122.78$ and B is worth $\frac{140}{1.05^{3}} \approx 120.94$, so A is higher; at 10%, A is worth $\frac{200}{1.1^{10}} \approx 77.11$ and B is worth $\frac{140}{1.1^{3}} \approx 105.18$, so B is higher.
    rubric:
      zh-cn:
        - "判断为假，并给出数值反例，或说明较晚的现金流对折现率更敏感（4 分）。"
        - "判断为假但理由不完整：2 分。只写判断：0 分。"
      en:
        - "States false and gives a numerical counterexample, or explains that later cash flows are more sensitive to the discount rate (4 points)."
        - "False with an incomplete reason: 2 points. Only the verdict: 0 points."
  - id: Q2
    kind: quiz
    part: judge
    easy_points: 4
    hard_points: 0
    points: 4
    concepts: [shadow-price, lagrange-multiplier]
    expected: { lam: "400", u90: "12000", u180: "96000", gain: "84000" }
    question:
      zh-cn: |-
        消费者的效用 $U = xy^2$，$p_x = 1$，$p_y = 3$，预算 $M = 90$ 美元。预算增加到 180 美元时，最大效用的增加量超过 $\lambda \times 90$ 的两倍，其中 $\lambda$ 是预算为 90 美元时的拉格朗日乘数。
      en: |-
        A consumer has utility $U = xy^2$ with $p_x = 1$, $p_y = 3$ and a budget of $M = 90$ dollars. If the budget rises to 180 dollars, the maximum utility rises by more than twice $\lambda \times 90$, where $\lambda$ is the Lagrange multiplier at a budget of 90 dollars.
    answer:
      zh-cn: |-
        真。一阶条件 $y^2 = \lambda$，$2xy = 3\lambda$，得 $y = \frac{2x}{3}$，代入预算 $x + 3y = M$ 得 $x = \frac{M}{3}$，$y = \frac{2M}{9}$，$U^*(M) = \frac{M}{3}\left(\frac{2M}{9}\right)^2 = \frac{4M^3}{243}$，$\lambda = \frac{dU^*}{dM} = \frac{4M^2}{81}$。$M = 90$ 时 $\lambda = 400$，$\lambda \times 90 = 36{,}000$，两倍为 72,000。实际 $U^*(90) = 12{,}000$，$U^*(180) = 96{,}000$，增加 84,000，超过 72,000。$\lambda$ 只是预算小幅变化时的变化率；这里 $\lambda$ 随 $M^2$ 增大，预算变化很大时 $\lambda \times \Delta M$ 会严重低估效用的增加。
      en: |-
        True. The first-order conditions $y^2 = \lambda$ and $2xy = 3\lambda$ give $y = \frac{2x}{3}$; with the budget $x + 3y = M$, $x = \frac{M}{3}$ and $y = \frac{2M}{9}$, so $U^*(M) = \frac{M}{3}\left(\frac{2M}{9}\right)^2 = \frac{4M^3}{243}$ and $\lambda = \frac{dU^*}{dM} = \frac{4M^2}{81}$. At $M = 90$, $\lambda = 400$, $\lambda \times 90 = 36{,}000$, and twice that is 72,000. In fact $U^*(90) = 12{,}000$ and $U^*(180) = 96{,}000$, an increase of 84,000, more than 72,000. $\lambda$ is only the rate of change for a small change in the budget; here $\lambda$ grows with $M^2$, so for a large change $\lambda \times \Delta M$ badly understates the gain in utility.
    rubric:
      zh-cn:
        - "判断为真，求出 $\\lambda = 400$ 与实际增加 84,000（或说明 $U^*$ 是 $M$ 的三次函数、$\\lambda$ 随 $M$ 增大），并与 72,000 比较（4 分）。"
        - "判断为真但理由不完整：2 分。只写判断：0 分。"
      en:
        - "States true, finds $\\lambda = 400$ and the actual increase of 84,000 (or explains that $U^*$ is cubic in $M$ and $\\lambda$ grows with $M$), and compares with 72,000 (4 points)."
        - "True with an incomplete reason: 2 points. Only the verdict: 0 points."

  - id: Q3
    kind: quiz
    part: judge
    easy_points: 4
    hard_points: 0
    points: 4
    concepts: [covariance, correlation, random-variable]
    expected: { cov: "0" }
    question:
      zh-cn: |-
        两项资产收益的协方差为 0，说明一项资产的收益不能告诉我们任何关于另一项资产收益的信息。
      en: |-
        If the covariance between the returns of two assets is 0, then one asset's return tells us nothing about the other asset's return.
    answer:
      zh-cn: |-
        假。协方差（和相关系数）只衡量线性关系。反例：三种情景等概率，A 的收益为 −10、0、10（%），B 的收益为 10、0、10（%），即 B 由 A 完全决定（$B = 0.1A^2$）。$E[A] = 0$，$E[B] \approx 6.67$，$\text{Cov} = \frac{1}{3}\big[(-10)(3.33) + 0 + (10)(3.33)\big] = 0$。协方差为 0，但知道 A 就完全知道 B。
      en: |-
        False. Covariance (and correlation) measures only linear relationships. Counterexample: three equally likely scenarios, A returns −10, 0, 10 (%) and B returns 10, 0, 10 (%), so B is fully determined by A ($B = 0.1A^2$). $E[A] = 0$, $E[B] \approx 6.67$, and $\text{Cov} = \frac{1}{3}\big[(-10)(3.33) + 0 + (10)(3.33)\big] = 0$. The covariance is 0, yet knowing A tells us B exactly.
    rubric:
      zh-cn:
        - "判断为假，并给出协方差为 0 但有确定关系的反例，或说明协方差只衡量线性关系（4 分）。"
        - "判断为假但理由不完整：2 分。只写判断：0 分。"
      en:
        - "States false and gives a counterexample with zero covariance but an exact relationship, or explains that covariance measures only linear relationships (4 points)."
        - "False with an incomplete reason: 2 points. Only the verdict: 0 points."

  - id: Q4
    kind: quiz
    part: judge
    easy_points: 0
    hard_points: 0
    points: 4
    concepts: [confidence-interval, hypothesis-test, standard-error, variance]
    expected: { se_d: "2.83", t: "2.12" }
    question:
      zh-cn: |-
        基金 A 和基金 B 的平均年收益估计值分别为 10% 和 4%，标准误都是 2 个百分点，两个估计相互独立。A 的 95% 置信区间约为 [6.08%, 13.92%]，B 的约为 [0.08%, 7.92%]，两个区间有重叠，所以在 5% 水平上不能认为两只基金的真实平均收益有差别。
      en: |-
        The estimated average yearly returns of fund A and fund B are 10% and 4%, both with a standard error of 2 percentage points, and the two estimates are independent. A's 95% confidence interval is about [6.08%, 13.92%] and B's is about [0.08%, 7.92%]. The intervals overlap, so at the 5% level we cannot conclude that the two funds have different true average returns.
    answer:
      zh-cn: |-
        假。要检验的是两者之差。差的估计值为 $10 - 4 = 6$ 个百分点；两个估计独立，差的方差是两个方差之和，标准误为 $\sqrt{2^2 + 2^2} \approx 2.83$。$t = \frac{6}{2.83} \approx 2.12 > 1.96$，在 5% 水平上显著。两个区间重叠并不说明差异不显著：差的标准误只是各自标准误的 $\sqrt{2}$ 倍，而不是两倍。
      en: |-
        False. What must be tested is the difference. The estimated difference is $10 - 4 = 6$ percentage points; the estimates are independent, so the variance of the difference is the sum of the two variances and its standard error is $\sqrt{2^2 + 2^2} \approx 2.83$. $t = \frac{6}{2.83} \approx 2.12 > 1.96$, significant at the 5% level. Overlapping intervals do not show that the difference is not significant: the standard error of the difference is only $\sqrt{2}$ times each standard error, not twice.
    rubric:
      zh-cn:
        - "判断为假，并对两者之差做检验（标准误约 2.83，$t \\approx 2.12$），或说明差的标准误是 $\\sqrt{2}$ 倍而不是两倍（4 分）。"
        - "判断为假但理由不完整：2 分。只写判断：0 分。"
      en:
        - "States false and tests the difference (standard error about 2.83, $t \\approx 2.12$), or explains that the standard error of the difference is $\\sqrt{2}$ times, not twice, each standard error (4 points)."
        - "False with an incomplete reason: 2 points. Only the verdict: 0 points."

  - id: Q5
    kind: quiz
    part: judge
    easy_points: 4
    hard_points: 0
    points: 4
    concepts: [regression-coefficient, r-squared, correlation]
    expected: { d: "0.25" }
    question:
      zh-cn: |-
        用同一组数据做 $y$ 对 $x$ 的回归，斜率为 2，$R^2 = 0.5$。那么用这组数据做 $x$ 对 $y$ 的回归，斜率是 0.25。
      en: |-
        A regression of $y$ on $x$ with a set of data has slope 2 and $R^2 = 0.5$. Then a regression of $x$ on $y$ with the same data has slope 0.25.
    answer:
      zh-cn: |-
        真。记 $S_{xy} = \sum (x_i - \bar x)(y_i - \bar y)$，$S_{xx}$、$S_{yy}$ 同理。$y$ 对 $x$ 的斜率 $b = \frac{S_{xy}}{S_{xx}}$，$x$ 对 $y$ 的斜率 $d = \frac{S_{xy}}{S_{yy}}$，所以 $bd = \frac{S_{xy}^2}{S_{xx}S_{yy}} = r^2$。一个自变量的回归中 $R^2 = r^2$，所以 $d = \frac{R^2}{b} = \frac{0.5}{2} = 0.25$，而不是 $\frac{1}{2}$。只有所有点都在一条直线上（$R^2 = 1$）时，两个斜率才互为倒数。
      en: |-
        True. Write $S_{xy} = \sum (x_i - \bar x)(y_i - \bar y)$, and $S_{xx}$ and $S_{yy}$ in the same way. The slope of $y$ on $x$ is $b = \frac{S_{xy}}{S_{xx}}$ and the slope of $x$ on $y$ is $d = \frac{S_{xy}}{S_{yy}}$, so $bd = \frac{S_{xy}^2}{S_{xx}S_{yy}} = r^2$. With one explanatory variable $R^2 = r^2$, so $d = \frac{R^2}{b} = \frac{0.5}{2} = 0.25$, not $\frac{1}{2}$. The two slopes are reciprocals only when all points lie on one line ($R^2 = 1$).
    rubric:
      zh-cn:
        - "判断为真，并由两个斜率的公式得出 $bd = r^2 = R^2$，算出 0.25（4 分）。"
        - "判断为真但理由不完整：2 分。只写判断，或判断为假（认为斜率是 0.5）：0 分。"
      en:
        - "States true and uses the two slope formulas to show $bd = r^2 = R^2$, giving 0.25 (4 points)."
        - "True with an incomplete reason: 2 points. Only the verdict, or false (taking the slope as 0.5): 0 points."

  # ---------- Part 2: problems ----------
  - id: Q6
    kind: quiz
    part: problem
    easy_points: 0
    hard_points: 0
    points: 16
    concepts: [ear, annuity, annuity-due, future-value, growing-perpetuity]
    expected: { ear: "6.17", pv: "801486", fv: "702935", n: "19.07", g: "0.87" }
    question:
      zh-cn: |-
        一个家庭计划 30 年后退休。退休后每年年初从账户取 60,000 美元，共取 25 年，第一笔在退休当天取出。账户的名义年利率始终为 6%，按月复利。
        (a) 退休当天账户里至少要有多少钱？（5 分）
        (b) 这个家庭现在账户里有 50,000 美元，从下个月起每月月末只能存 400 美元，共存 360 次，最后一次在退休当天。退休后余额继续按同样的利率计息。这笔钱够取多少次完整的 60,000 美元？（5 分）
        (c) 家庭改变计划：退休时账户里有 (a) 的金额，领取永远持续下去（留给子女），每年年初领取一次、第一笔在退休当天，以后每年按固定的比例增长。如果第一年要领 40,000 美元，每年的增长率最高是多少？（6 分）
      en: |-
        A household plans to retire in 30 years. After retirement it will withdraw 60,000 dollars at the start of each year for 25 years, with the first withdrawal on the day of retirement. The account always pays a nominal annual rate of 6%, compounded monthly.
        (a) How much must the account hold on the day of retirement? (5 points)
        (b) The household has 50,000 dollars in the account today and can deposit only 400 dollars at the end of each month from next month on, 360 deposits in all, the last on the day of retirement. After retirement the balance keeps earning the same rate. How many full withdrawals of 60,000 dollars will this money pay for? (5 points)
        (c) The household changes its plan: it retires with the amount from (a), and the withdrawals continue forever (for its children), once at the start of each year with the first on the day of retirement, growing by a fixed rate each year. If the first withdrawal is to be 40,000 dollars, what is the highest possible yearly growth rate? (6 points)
    answer:
      zh-cn: |-
        (a) 取款每年一次，而利息按月复利，所以要用有效年利率：$R = 1.005^{12} - 1 \approx 6.17$%。取款在每年年初，是期初年金：
        $PV = 60{,}000 \times \frac{1 - (1+R)^{-25}}{R} \times (1+R) \approx 801{,}486$ 美元。
        （直接用 6% 作为年利率会得到约 813,021 美元；按期末年金计算则会少算一期利息。）
        (b) 月利率 $i = 0.005$，$n = 360$。退休时 $FV = 50{,}000 \times 1.005^{360} + 400 \times \frac{1.005^{360} - 1}{0.005} \approx 301{,}129 + 401{,}806 \approx 702{,}935$ 美元。
        设能取 $n$ 年：$60{,}000 \times \frac{1 - (1+R)^{-n}}{R} \times (1+R) = 702{,}935$，得 $(1+R)^{-n} = 1 - \frac{702{,}935 \times R}{60{,}000 \times (1+R)} \approx 0.3194$，$n = \frac{-\ln 0.3194}{\ln(1+R)} \approx 19.07$。够取 19 次完整的 60,000 美元，第 20 年只剩一小部分。
        (c) 设增长率为 $g$、第一年领取 $W$。第一笔在退休当天，之后从第 1 年末起是首笔为 $W(1+g)$ 的增长永续年金（公式表中的 $C$ 是第 1 期期末的付款，不能直接用 $W$ 代入），所以 $PV = W + \frac{W(1+g)}{R - g} = W \cdot \frac{1+R}{R-g}$。
        由 $801{,}486 = 40{,}000 \times \frac{1+R}{R-g}$ 得 $g = R - \frac{40{,}000 \times (1+R)}{801{,}486} \approx 6.168\% - 5.299\% \approx 0.87$%。增长率高于这个值时，同样的本金付不起第一年 40,000 美元。（把 40,000 美元当作第 1 年末的付款，会得到 $g = R - \frac{40{,}000}{801{,}486} \approx 1.18\%$，偏高。）
      en: |-
        (a) Withdrawals are yearly while interest is compounded monthly, so the effective annual rate is needed: $R = 1.005^{12} - 1 \approx 6.17$%. The withdrawals are at the start of each year, an annuity due:
        $PV = 60{,}000 \times \frac{1 - (1+R)^{-25}}{R} \times (1+R) \approx 801{,}486$ dollars.
        (Using 6% directly as the annual rate gives about 813,021 dollars; treating the withdrawals as end-of-year leaves out one period of interest.)
        (b) The monthly rate is $i = 0.005$ and $n = 360$. At retirement $FV = 50{,}000 \times 1.005^{360} + 400 \times \frac{1.005^{360} - 1}{0.005} \approx 301{,}129 + 401{,}806 \approx 702{,}935$ dollars.
        Let the money last $n$ years: $60{,}000 \times \frac{1 - (1+R)^{-n}}{R} \times (1+R) = 702{,}935$ gives $(1+R)^{-n} = 1 - \frac{702{,}935 \times R}{60{,}000 \times (1+R)} \approx 0.3194$, so $n = \frac{-\ln 0.3194}{\ln(1+R)} \approx 19.07$. It pays for 19 full withdrawals of 60,000 dollars, with only a small amount left for year 20.
        (c) Let the growth rate be $g$ and the first withdrawal $W$. The first withdrawal is on the day of retirement; from the end of year 1 there is a growing perpetuity whose first payment is $W(1+g)$ (the $C$ on the formula sheet is the payment at the end of the first period, so $W$ cannot be put in directly), so $PV = W + \frac{W(1+g)}{R - g} = W \cdot \frac{1+R}{R-g}$.
        From $801{,}486 = 40{,}000 \times \frac{1+R}{R-g}$, $g = R - \frac{40{,}000 \times (1+R)}{801{,}486} \approx 6.168\% - 5.299\% \approx 0.87$%. With a higher growth rate the same amount cannot pay 40,000 dollars in the first year. (Treating the 40,000 dollars as a payment at the end of year 1 gives $g = R - \frac{40{,}000}{801{,}486} \approx 1.18\%$, which is too high.)
    rubric:
      zh-cn:
        - "(a) 换算有效年利率 2 分；按期初年金求现值，约 801,486 美元 3 分。直接用 6% 或按期末年金计算、其余正确：最多 2 分。"
        - "(b) 退休时的金额（现有存款和每月存款的终值都计入）2 分；用期初年金反解年数，约 19.07 年、19 次完整取款 3 分。忽略现有存款或按期末年金反解、其余正确：扣 1 分。"
        - "(c) 正确处理第一笔在退休当天（$PV = W \\cdot \\frac{1+R}{R-g}$ 或等价形式）3 分；解出约 0.87% 3 分。把 40,000 美元当作期末付款（约 1.18%）：最多 2 分。用 (a) 的错误结果但方法正确：不扣分。"
      en:
        - "(a) Conversion to the effective annual rate 2 points; present value as an annuity due, about 801,486 dollars, 3 points. Using 6% directly or an end-of-year annuity with the rest correct: at most 2 points."
        - "(b) The amount at retirement (including the future values of both the existing balance and the monthly deposits) 2 points; solving the annuity due for the number of years, about 19.07 years and 19 full withdrawals, 3 points. Ignoring the existing balance or solving with an end-of-year annuity, with the rest correct: minus 1 point."
        - "(c) Correct treatment of the first withdrawal on the day of retirement ($PV = W \\cdot \\frac{1+R}{R-g}$ or an equivalent form) 3 points; solving for about 0.87% 3 points. Treating the 40,000 dollars as an end-of-year payment (about 1.18%): at most 2 points. Correct method with a wrong result carried over from (a): no deduction."

  - id: Q7
    kind: quiz
    part: problem
    easy_points: 0
    hard_points: 0
    points: 16
    concepts: [profit-maximization, marginal-revenue, marginal-cost, first-order-condition, second-order-condition, fixed-cost, sunk-cost]
    expected: { q: "20", p: "60", profit: "600", p_new: "64", rise: "4", c_shut: "60" }
    question:
      zh-cn: |-
        一家公司是某种产品唯一的卖家。卖出 $q$ 件时，市场价格为 $p(q) = 100 - 2q$（美元）。每件的成本为 $c$，每年另有设备租金 $F$，即 $C(q) = cq + F$。
        (a) 求利润最高的产量 $q^*$ 和价格 $p^*$（用 $c$ 表示），以及 $c = 20$、$F = 200$ 时的最大利润。（4 分）
        (b) 原料涨价，$c$ 从 20 变为 28。一位同事说：“每件成本涨了 8 美元，就应该把价格提高 8 美元，把成本完全转嫁给顾客。”这个说法对吗？用边际收入和边际成本说明。（5 分）
        (c) 设 $F = 200$。设备租金按月支付，公司停产后可以立即退租，不再支付。另一位同事说：“只要一阶条件给出的产量是正数，生产就比停产好。”这个说法对吗？$c$ 在什么范围内时公司应该停产？（7 分）
      en: |-
        A company is the only seller of a product. When it sells $q$ units, the market price is $p(q) = 100 - 2q$ (dollars). Each unit costs $c$, and there is also a yearly equipment rent $F$, so $C(q) = cq + F$.
        (a) Find the profit-maximizing output $q^*$ and price $p^*$ (in terms of $c$), and the maximum profit when $c = 20$ and $F = 200$. (4 points)
        (b) Material prices rise and $c$ goes from 20 to 28. A colleague says: "Each unit costs 8 dollars more, so we should raise the price by 8 dollars and pass the whole cost on to customers." Is this right? Explain with marginal revenue and marginal cost. (5 points)
        (c) Let $F = 200$. The rent is paid monthly, and if the company stops producing it can end the lease at once and pay no more. Another colleague says: "As long as the first-order condition gives a positive output, producing is better than stopping." Is this right? For what range of $c$ should the company stop producing? (7 points)
    answer:
      zh-cn: |-
        (a) $\pi = (100 - 2q)q - cq - F$。$\pi' = 100 - c - 4q = 0$，$q^* = \frac{100 - c}{4}$；$\pi'' = -4 < 0$，是最大值。$p^* = 100 - 2q^* = \frac{100 + c}{2}$，$\pi^* = \frac{(100 - c)^2}{8} - F$。$c = 20$、$F = 200$ 时 $q^* = 20$，$p^* = 60$，最大利润 $800 - 200 = 600$。
        (b) 不对。$p^* = \frac{100 + c}{2}$，成本每涨 1 美元价格只涨 0.5 美元：$c = 28$ 时 $p^* = 64$，只上涨 4 美元。原因：最优点满足 $MR = MC$。边际收入 $100 - 4q$ 随产量下降的速度是价格 $100 - 2q$ 的两倍；边际成本上升 8 时，产量只需减少 2 件就能让边际收入上升 8，而减少 2 件只让价格上升 4。如果把价格提高 8（产量减到 16），$MR = 36 > MC = 28$，多卖一件还能增加利润。
        (c) 不对。租金停产后就不用付，是可以避免的成本，所以要比较最优产量的利润和不生产（$q = 0$，利润 0）。生产要求 $\frac{(100 - c)^2}{8} \ge 200$，即 $100 - c \ge 40$，$c \le 60$。所以 $c > 60$ 时应停产（$c = 60$ 时两者一样好）。$60 < c < 100$ 时一阶条件仍给出正的产量（例如 $c = 64$ 时 $q^* = 9$），但这时最好的利润也是负的（$\frac{36^2}{8} - 200 = -38$），不如退租停产。一阶条件只说明在生产的前提下哪个产量最好，不说明生产是否比停产好。
      en: |-
        (a) $\pi = (100 - 2q)q - cq - F$. $\pi' = 100 - c - 4q = 0$ gives $q^* = \frac{100 - c}{4}$; $\pi'' = -4 < 0$, so it is a maximum. $p^* = 100 - 2q^* = \frac{100 + c}{2}$ and $\pi^* = \frac{(100 - c)^2}{8} - F$. With $c = 20$ and $F = 200$: $q^* = 20$, $p^* = 60$, and the maximum profit is $800 - 200 = 600$.
        (b) No. $p^* = \frac{100 + c}{2}$, so each dollar of cost raises the price by only 0.5 dollars: at $c = 28$, $p^* = 64$, a rise of only 4 dollars. Reason: the optimum satisfies $MR = MC$. Marginal revenue $100 - 4q$ falls with output twice as fast as the price $100 - 2q$; when marginal cost rises by 8, output needs to fall by only 2 units to raise marginal revenue by 8, and 2 fewer units raise the price by only 4. If the price were raised by 8 (output 16), $MR = 36 > MC = 28$, so selling one more unit would still add profit.
        (c) No. The rent is not paid after stopping, so it is an avoidable cost, and the profit at the optimal output must be compared with not producing ($q = 0$, profit 0). Producing requires $\frac{(100 - c)^2}{8} \ge 200$, that is, $100 - c \ge 40$ and $c \le 60$. So the company should stop for $c > 60$ (at $c = 60$ both are equally good). For $60 < c < 100$ the first-order condition still gives a positive output (for example, $c = 64$ gives $q^* = 9$), but even the best profit is then negative ($\frac{36^2}{8} - 200 = -38$), so ending the lease and stopping is better. The first-order condition only tells which output is best if the company produces, not whether producing beats stopping.
    rubric:
      zh-cn:
        - "(a) $q^*$、$p^*$ 的表达式 2 分；最大利润 600 2 分。"
        - "(b) 判断不对，指出价格只涨 4 美元 2 分；用 $MR$ 比价格下降得快说明原因 3 分。"
        - "(c) 指出租金可以避免、要与 $q = 0$ 比较 3 分；得出 $c > 60$ 时停产 2 分；用 $60 < c < 100$ 的情形说明同事的说法不对 2 分。"
      en:
        - "(a) Expressions for $q^*$ and $p^*$ 2 points; maximum profit 600 2 points."
        - "(b) Judges the statement wrong and finds that the price rises by only 4 dollars 2 points; explains with $MR$ falling faster than the price 3 points."
        - "(c) Recognizes that the rent is avoidable and compares with $q = 0$ 3 points; finds that the company stops for $c > 60$ 2 points; uses the case $60 < c < 100$ to show that the colleague is wrong 2 points."

  - id: Q8
    kind: quiz
    part: problem
    easy_points: 0
    hard_points: 0
    points: 18
    concepts: [portfolio-variance, first-order-condition, second-order-condition, corner-solution, correlation]
    expected: { rho: "0.25", w: "25", threshold: "0.67" }
    question:
      zh-cn: |-
        两只基金 A、B 的标准差为 $\sigma_A$、$\sigma_B$，相关系数为 $\rho$，且 $\rho < 1$。组合中 A 的权重为 $w$，B 为 $1 - w$。
        (a) 用导数推导使组合方差最小的权重 $w^*$（用 $\sigma_A$、$\sigma_B$、$\rho$ 表示），并说明它确实是最小值。（5 分）
        (b) 已知 $\sigma_A = 24\%$，$\sigma_B = 16\%$。一位分析师说，这两只基金的最小方差组合同时持有两只基金（两个权重都为正），组合的方差为 216（%²）。求两只基金的相关系数。（7 分）
        (c) 仍取 $\sigma_A = 24\%$、$\sigma_B = 16\%$，不允许卖空（$0 \le w \le 1$）。相关系数在什么范围内时，最小方差组合完全不持有 A？（6 分）
      en: |-
        Two funds A and B have standard deviations $\sigma_A$ and $\sigma_B$ and correlation $\rho$, with $\rho < 1$. The portfolio holds A with weight $w$ and B with weight $1 - w$.
        (a) Use the derivative to derive the weight $w^*$ that minimizes the portfolio variance (in terms of $\sigma_A$, $\sigma_B$ and $\rho$), and show that it is a minimum. (5 points)
        (b) Let $\sigma_A = 24\%$ and $\sigma_B = 16\%$. An analyst says that the minimum-variance portfolio of these two funds holds both funds (both weights positive) and has a variance of 216 (%²). Find the correlation between the two funds. (7 points)
        (c) Still with $\sigma_A = 24\%$ and $\sigma_B = 16\%$, short selling is not allowed ($0 \le w \le 1$). For what range of the correlation does the minimum-variance portfolio hold no A at all? (6 points)
    answer:
      zh-cn: |-
        (a) $\sigma_P^2 = w^2\sigma_A^2 + (1-w)^2\sigma_B^2 + 2w(1-w)\rho\sigma_A\sigma_B$。
        $\frac{d\sigma_P^2}{dw} = 2w\sigma_A^2 - 2(1-w)\sigma_B^2 + 2(1 - 2w)\rho\sigma_A\sigma_B = 0$，解得
        $w^* = \frac{\sigma_B^2 - \rho\sigma_A\sigma_B}{\sigma_A^2 + \sigma_B^2 - 2\rho\sigma_A\sigma_B}$。
        二阶导数 $2(\sigma_A^2 + \sigma_B^2 - 2\rho\sigma_A\sigma_B) = 2\big[(\sigma_A - \sigma_B)^2 + 2(1 - \rho)\sigma_A\sigma_B\big] > 0$（因为 $\rho < 1$），是最小值。
        (b) 把 $w^*$ 代回方差，最小方差为 $\frac{\sigma_A^2\sigma_B^2(1 - \rho^2)}{\sigma_A^2 + \sigma_B^2 - 2\rho\sigma_A\sigma_B}$。令它等于 216：$\frac{147{,}456\,(1 - \rho^2)}{832 - 768\rho} = 216$，即 $32\rho^2 - 36\rho + 7 = 0$，$\rho = 0.25$ 或 $\rho = 0.875$。
        $\rho = 0.875$ 时 $w^* = \frac{256 - 336}{832 - 672} = -0.5$，要卖空 A，与“两个权重都为正”矛盾，舍去。所以 $\rho = 0.25$（这时 A 的权重 $w^* = \frac{256 - 96}{832 - 192} = 0.25$，即 25%，两个权重都为正）。
        (c) 方差是 $w$ 的开口向上的二次函数。$w^* \le 0$ 时，在 $[0, 1]$ 上方差随 $w$ 增加，不允许卖空时最优是角点 $w = 0$。$w^* \le 0$ 即 $\sigma_B^2 - \rho\sigma_A\sigma_B \le 0$，$\rho \ge \frac{\sigma_B}{\sigma_A} = \frac{2}{3} \approx 0.67$。所以 $\frac{2}{3} \le \rho < 1$ 时完全不持有 A。
      en: |-
        (a) $\sigma_P^2 = w^2\sigma_A^2 + (1-w)^2\sigma_B^2 + 2w(1-w)\rho\sigma_A\sigma_B$.
        $\frac{d\sigma_P^2}{dw} = 2w\sigma_A^2 - 2(1-w)\sigma_B^2 + 2(1 - 2w)\rho\sigma_A\sigma_B = 0$ gives
        $w^* = \frac{\sigma_B^2 - \rho\sigma_A\sigma_B}{\sigma_A^2 + \sigma_B^2 - 2\rho\sigma_A\sigma_B}$.
        The second derivative is $2(\sigma_A^2 + \sigma_B^2 - 2\rho\sigma_A\sigma_B) = 2\big[(\sigma_A - \sigma_B)^2 + 2(1 - \rho)\sigma_A\sigma_B\big] > 0$ (because $\rho < 1$), so it is a minimum.
        (b) Substituting $w^*$ back into the variance gives the minimum variance $\frac{\sigma_A^2\sigma_B^2(1 - \rho^2)}{\sigma_A^2 + \sigma_B^2 - 2\rho\sigma_A\sigma_B}$. Setting it equal to 216: $\frac{147{,}456\,(1 - \rho^2)}{832 - 768\rho} = 216$, that is, $32\rho^2 - 36\rho + 7 = 0$, so $\rho = 0.25$ or $\rho = 0.875$.
        At $\rho = 0.875$, $w^* = \frac{256 - 336}{832 - 672} = -0.5$, a short position in A, which contradicts "both weights positive", so it is rejected. So $\rho = 0.25$ (A's weight is then $w^* = \frac{256 - 96}{832 - 192} = 0.25$, that is, 25%, and both weights are positive).
        (c) The variance is a quadratic in $w$ that opens upward. When $w^* \le 0$, the variance rises with $w$ on $[0, 1]$, so without short selling the optimum is the corner $w = 0$. $w^* \le 0$ means $\sigma_B^2 - \rho\sigma_A\sigma_B \le 0$, that is, $\rho \ge \frac{\sigma_B}{\sigma_A} = \frac{2}{3} \approx 0.67$. So for $\frac{2}{3} \le \rho < 1$ the portfolio holds no A.
    rubric:
      zh-cn:
        - "(a) 方差表达式与求导 2 分，$w^*$ 公式 2 分，二阶条件 1 分。"
        - "(b) 由最小方差列出关于 $\\rho$ 的方程并解出两个根 4 分；用“两个权重都为正”舍去 0.875，得 $\\rho = 0.25$ 3 分。保留两个根、没有取舍：最多 4 分。"
        - "(c) 指出不允许卖空时最优为角点、需要 $w^* \\le 0$ 3 分；得出 $\\rho \\ge \\frac{2}{3}$ 3 分。"
      en:
        - "(a) Variance expression and derivative 2 points; formula for $w^*$ 2 points; second-order condition 1 point."
        - "(b) Sets up the equation in $\\rho$ from the minimum variance and finds both roots 4 points; rejects 0.875 because both weights must be positive, giving $\\rho = 0.25$, 3 points. Keeping both roots without choosing: at most 4 points."
        - "(c) The optimum without short selling is a corner when $w^* \\le 0$: 3 points; $\\rho \\ge \\frac{2}{3}$: 3 points."

  - id: Q9
    kind: quiz
    part: problem
    easy_points: 0
    hard_points: 0
    points: 15
    concepts: [log-return, lognormal-distribution, median, right-skew, variance]
    expected: { mu: "7", sigma: "18", ratio25: "1.50", ratio40: "1.91" }
    question:
      zh-cn: |-
        某股票指数每年的对数收益率服从同一个正态分布，各年相互独立，期望和标准差未知。一份报告说：今天投入 100 美元，25 年后财富的中位数约为 575.5 美元，均值约为 862.8 美元。报告用均值说明“你 25 年后大约会有多少钱”。
        (a) 由报告的数字求每年对数收益率的期望和标准差（以百分比表示，取整数）。（8 分）
        (b) 如果持有期从 25 年延长到 40 年，财富的均值是中位数的多少倍？由此说明：持有期越长，用均值描述典型投资者的结果，偏差是变大还是变小。（7 分）
      en: |-
        The yearly log return of a stock index follows the same normal distribution every year, independent across years, with unknown mean and standard deviation. A report says: if you invest 100 dollars today, the median of your wealth after 25 years is about 575.5 dollars and the mean is about 862.8 dollars. The report uses the mean to describe "about how much you will have in 25 years".
        (a) From the report's numbers, find the mean and standard deviation of the yearly log return (in percent, rounded to whole numbers). (8 points)
        (b) If the holding period is extended from 25 to 40 years, how many times the median is the mean of wealth? Use this to explain whether, as the holding period gets longer, using the mean to describe a typical investor's result becomes more or less misleading. (7 points)
    answer:
      zh-cn: |-
        (a) 对数收益率可以相加，25 年的总对数收益率 $S$ 服从正态分布，设期望为 $m$、标准差为 $s$，则 $\ln W = \ln 100 + S$，财富服从对数正态分布。中位数 $100\,e^{m} = 575.5$，得 $m = \ln 5.755 \approx 1.75$；均值与中位数之比 $e^{s^2/2} = \frac{862.8}{575.5} \approx 1.50$，得 $s^2 \approx 0.81$，$s \approx 0.9$。各年独立同分布：期望是每年的 25 倍；方差是 25 倍，所以标准差是 $\sqrt{25} = 5$ 倍。每年的期望约 $\frac{1.75}{25} = 7$%，标准差约 $\frac{0.9}{5} = 18$%。（把标准差也除以 25 会得到 3.6%，这是错的。）
        (b) 均值与中位数之比为 $e^{s^2/2}$，而 $s^2 = n\sigma^2$ 随年数成正比增加。40 年时 $s^2 = 40 \times 0.18^2 = 1.296$，比值 $e^{0.648} \approx 1.91$，高于 25 年时的 1.50。持有期越长，财富分布越右偏，均值被少数结果很好的路径拉得离中位数越远，大多数投资者达不到均值，用均值描述典型结果的偏差越大；应该看中位数或分位数。
      en: |-
        (a) Log returns add up, so the total log return $S$ over 25 years is normally distributed; let its mean be $m$ and its standard deviation $s$. Then $\ln W = \ln 100 + S$ and wealth is lognormal. The median $100\,e^{m} = 575.5$ gives $m = \ln 5.755 \approx 1.75$; the ratio of mean to median $e^{s^2/2} = \frac{862.8}{575.5} \approx 1.50$ gives $s^2 \approx 0.81$ and $s \approx 0.9$. With independent, identically distributed years, the mean is 25 times the yearly mean; the variance is 25 times as large, so the standard deviation is $\sqrt{25} = 5$ times as large. The yearly mean is about $\frac{1.75}{25} = 7$% and the standard deviation about $\frac{0.9}{5} = 18$%. (Dividing the standard deviation by 25 as well gives 3.6%, which is wrong.)
        (b) The ratio of mean to median is $e^{s^2/2}$, and $s^2 = n\sigma^2$ grows in proportion to the number of years. For 40 years $s^2 = 40 \times 0.18^2 = 1.296$ and the ratio is $e^{0.648} \approx 1.91$, above the 1.50 for 25 years. The longer the holding period, the more right-skewed the distribution of wealth, and the further a few very good paths pull the mean above the median; most investors do not reach the mean, so using the mean for a typical result becomes more misleading. The median or percentiles should be used instead.
    rubric:
      zh-cn:
        - "(a) 由中位数求 $m$ 2 分；由均值与中位数之比求 $s$ 3 分；换算成每年：期望约 7% 1 分，标准差按 $\\sqrt{25}$ 换算约 18% 2 分。标准差除以 25：后 2 分不给。"
        - "(b) 指出比值为 $e^{s^2/2}$、$s^2$ 与年数成正比 3 分；40 年时约 1.91 2 分；说明偏差变大、应看中位数 2 分。用 (a) 的错误结果但方法正确：不扣分。"
      en:
        - "(a) $m$ from the median 2 points; $s$ from the ratio of mean to median 3 points; conversion to one year: mean about 7% 1 point, standard deviation scaled by $\\sqrt{25}$ to about 18% 2 points. Standard deviation divided by 25: no points for the last 2."
        - "(b) The ratio is $e^{s^2/2}$ with $s^2$ proportional to the number of years 3 points; about 1.91 for 40 years 2 points; explains that the mean becomes more misleading and that the median should be used 2 points. Correct method with a wrong result carried over from (a): no deduction."

  - id: Q10
    kind: quiz
    part: problem
    easy_points: 0
    hard_points: 0
    points: 15
    concepts: [residual, regression-coefficient, normal-distribution]
    expected: { gap: "0.7", pred: "5.6", lo: "-5.7", hi: "16.9" }
    question:
      zh-cn: |-
        用一只基金过去 60 个月的月收益对市场月收益（%）做回归，结果为：截距 $a = 0.4$，斜率 $b = 1.3$，残差的标准差为 5.75%。同期市场月收益的平均值为 1%。
        (a) 一位分析师说：“截距是 0.4，说明这只基金平均每月比市场多赚 0.4 个百分点。”这段时期基金平均每月实际比市场多赚多少？分析师的说法错在哪里？（7 分）
        (b) 某个月市场涨了 4%。有人说：“这个月市场涨了 4%，这只基金这个月不可能亏钱。”忽略系数的估计误差，并假设残差近似服从正态分布，用大约 95% 的这类月份所在的范围判断这个说法。（8 分）
      en: |-
        A fund's monthly returns over the past 60 months are regressed on the market's monthly returns (%). The result: intercept $a = 0.4$, slope $b = 1.3$, and a residual standard deviation of 5.75%. Over the same period the market's average monthly return was 1%.
        (a) An analyst says: "The intercept is 0.4, so on average the fund earns 0.4 percentage points a month more than the market." Over this period, how much more than the market did the fund actually earn on average per month? What is wrong with the analyst's statement? (7 points)
        (b) In one month the market rises 4%. Someone says: "The market rose 4% this month, so this fund cannot lose money this month." Ignoring the estimation error of the coefficients and assuming that the residuals are approximately normal, judge this statement using the range in which about 95% of such months fall. (8 points)
    answer:
      zh-cn: |-
        (a) 回归直线经过平均点，基金平均收益为 $0.4 + 1.3 \times 1 = 1.7$%，每月平均比市场多赚 $1.7 - 1 = 0.7$ 个百分点，不是 0.4。错在：截距是市场收益为 0 时基金的平均收益，不是基金比市场多赚的部分。基金减市场的平均差为 $a + (b - 1)x$：其中 0.4 与市场涨跌无关；另外 $(b - 1)x = 0.3 \times 1 = 0.3$ 来自 $b = 1.3 > 1$，即基金承担了比市场更大的市场风险，市场下跌时这一部分是负的（例如市场跌 4% 时为 −1.2），基金反而跑输市场。
        (b) 预测 $0.4 + 1.3 \times 4 = 5.6$%。范围约 $5.6 \pm 1.96 \times 5.75$，即 $[-5.7, 16.9]$（%）。说法不对：范围的下限是负数。残差的标准差和预测值差不多大，即使市场涨了 4%，基金在相当一部分这样的月份里仍会亏钱。回归给出的是平均关系，不是每个月都成立。
      en: |-
        (a) The regression line passes through the point of averages, so the fund's average return is $0.4 + 1.3 \times 1 = 1.7$%, and it earned $1.7 - 1 = 0.7$ percentage points a month more than the market on average, not 0.4. What is wrong: the intercept is the fund's average return when the market return is 0, not the amount by which the fund beats the market. The average difference between fund and market is $a + (b - 1)x$: the 0.4 does not depend on the market; the other $(b - 1)x = 0.3 \times 1 = 0.3$ comes from $b = 1.3 > 1$, that is, from the fund taking more market risk than the market, and this part is negative when the market falls (for example −1.2 when the market falls 4%), so the fund then trails the market.
        (b) The prediction is $0.4 + 1.3 \times 4 = 5.6$%. The range is about $5.6 \pm 1.96 \times 5.75$, that is, $[-5.7, 16.9]$ (%). The statement is wrong: the lower end of the range is negative. The residual standard deviation is about as large as the prediction, so even when the market rises 4%, the fund still loses money in a fair share of such months. The regression gives an average relation, not one that holds every month.
    rubric:
      zh-cn:
        - "(a) 算出平均多赚约 0.7 个百分点 3 分；指出截距是市场收益为 0 时的值，差额为 $a + (b - 1)x$，其中一部分来自 $b > 1$ 的市场风险 4 分。"
        - "(b) 预测 5.6% 2 分；用残差标准差给出范围约 −5.7% 到 16.9% 3 分；判断说法不对，并说明回归只是平均关系 3 分。"
      en:
        - "(a) Finds that the fund earned about 0.7 percentage points more on average 3 points; explains that the intercept is the value when the market return is 0, that the difference is $a + (b - 1)x$, and that part of it comes from market risk with $b > 1$ 4 points."
        - "(b) Prediction of 5.6% 2 points; range of about −5.7% to 16.9% from the residual standard deviation 3 points; judges the statement wrong and explains that the regression is only an average relation 3 points."
