# Answer key for quiz E1 (microeconomics, lessons 1.1–1.9). Shown to learners only inside the
# generated scoring prompt. The quiz page shows only the questions and their points.
# expected: values are recomputed by course/verify/E1.py in CI and must appear verbatim in every answer text.
# Each question tests a different idea and names the misconception it can reveal (common_errors);
# the parts of a problem build on each other.

lesson: "E1"

context:
  - zh-cn: |-
      测验 E1 考 [[1.1]] 到 [[1.9]]（微观经济学），也会用到第 0 阶段的工具（现值、增长永续年金、期望）。学习者可以用计算器或代码，卷首有公式表（弹性、边际替代率与相切条件、跨期预算约束与 Euler 方程、Fisher 方程、期望效用、确定性等价与风险溢价的近似公式、成本曲线与停产条件、垄断的 $MR$ 与勒纳指数、永续年金与增长永续年金、税收使买方价格与卖方价格相差 $t$）。题目考的是理解：评分时，推理和理由比算术更重要。
    en: |-
      Quiz E1 covers [[1.1]] to [[1.9]] (microeconomics) and also uses tools from Stage 0 (present value, growing perpetuities, expected value). The learner may use a calculator or code, and the quiz starts with a formula sheet (elasticity, the marginal rate of substitution and the tangency condition, the intertemporal budget constraint and the Euler equation, the Fisher equation, expected utility, the certainty equivalent and the approximate risk premium, cost curves and the shutdown condition, the monopolist's $MR$ and the Lerner index, perpetuities and growing perpetuities, and a tax that makes the buyers' and sellers' prices differ by $t$). The questions test understanding: when scoring, reasoning and reasons count more than arithmetic.

common_errors:
  - questions: [Q1]
    zh-cn: |-
      把名义上的“不亏钱”当作购买力不减少。名义收益率低于通胀时，实际收益率为负，按购买力计算财富在缩水。
    en: |-
      Taking "no nominal loss" to mean no loss of purchasing power. When the nominal return is below inflation, the real return is negative and wealth shrinks in purchasing power.
  - questions: [Q2]
    zh-cn: |-
      认为偏好或收入不同的人，边际替代率也一定不同。内部最优时每个人的边际替代率都等于共同的价格比，不同的只是买的数量。
    en: |-
      Thinking that people with different preferences or incomes must have different marginal rates of substitution. At an interior optimum everyone's MRS equals the common price ratio; what differs is only the quantities bought.
  - questions: [Q3]
    zh-cn: |-
      把价格和数量同时上升的观测当作一条需求曲线上的点，得出需求曲线向上倾斜。这是需求曲线向右移动、沿着供给曲线移动的结果。
    en: |-
      Treating observations in which price and quantity both rose as points on one demand curve and concluding that demand slopes upward. This is the result of demand shifting right and moving along the supply curve.
  - questions: [Q4, Q9]
    zh-cn: |-
      认为任何税都会造成无谓损失，或者认为由谁缴税谁就承担税负。无谓损失来自成交量的减少；税负的分配取决于双方对价格的反应，而且会随时间变化。
    en: |-
      Thinking that every tax causes a deadweight loss, or that whoever pays a tax bears it. The deadweight loss comes from the fall in the quantity traded; the split of the burden depends on how each side responds to the price and changes over time.
  - questions: [Q5]
    zh-cn: |-
      认为净现值为正的项目一定会被投资；或者没有注意到，新股按平均价值定价时，好公司的老股东要把一部分价值让给新股东。
    en: |-
      Thinking that a project with a positive net present value will always be undertaken; or not noticing that when new shares are priced at the average value, the old shareholders of a good company give part of its value to the new shareholders.
  - questions: [Q6]
    zh-cn: |-
      把今年的经济利润当作会永远持续，或者认为利润高的公司就有护城河。在可以自由进入的行业，经济利润会被竞争消除；只有进入壁垒才能让它持续。
    en: |-
      Treating this year's economic profit as permanent, or thinking that a highly profitable company must have a moat. In an industry with free entry, economic profit is competed away; only barriers to entry keep it going.
  - questions: [Q7]
    zh-cn: |-
      直接比较有风险的期望收益和无风险的利率（7% > 4%），忽略了顾问的费用和风险溢价；或者没有注意到顾问的报酬方式使他偏向推荐投资。
    en: |-
      Comparing a risky expected return directly with a risk-free rate (7% > 4%), ignoring the adviser's fee and the risk premium; or not noticing that the way the adviser is paid tilts the recommendation toward investing.
  - questions: [Q8]
    zh-cn: |-
      认为重复博弈中合作总能维持，或者认为厂商数目与合作能否维持无关。厂商越多，每家分到的合作利润越少，而背叛一次仍能拿到整个市场。
    en: |-
      Thinking that cooperation can always be sustained in a repeated game, or that the number of firms does not matter. With more firms each one's share of the cooperative profit is smaller, while cheating once still captures the whole market.

questions:
  - id: Q1
    kind: quiz
    part: judge
    points: 6
    concepts: [nominal-interest-rate, real-interest-rate, fisher-equation, inflation]
    expected: { real: "90705", loss: "9.3" }
    question:
      zh-cn: |-
        某理财产品期限 10 年，保证每年 2% 的名义收益（按年复利），到期一次还本付息，宣传为“保本，不会亏钱”。如果这 10 年每年的通胀都是 3%，持有到期的投资者按购买力计算的财富没有减少。
      en: |-
        A 10-year investment product guarantees a nominal return of 2% a year (compounded annually), with principal and interest paid at maturity, and is advertised as "principal protected, you cannot lose money". If inflation is 3% in each of the 10 years, an investor who holds it to maturity has not lost purchasing power.
    answer:
      zh-cn: |-
        假。每年的实际收益率 $\frac{1.02}{1.03} - 1 \approx -0.97\%$，是负的。投入 100,000 美元，10 年后的名义金额是 $100{,}000 \times 1.02^{10}$，按今天的购买力相当于
        $$100{,}000 \times \left(\frac{1.02}{1.03}\right)^{10} \approx 90{,}705$$
        美元，购买力减少了约 9.3%。“保本”只保证名义金额不减少，不保证购买力。
      en: |-
        False. The real return each year is $\frac{1.02}{1.03} - 1 \approx -0.97\%$, which is negative. With 100,000 dollars invested, the nominal amount after 10 years is $100{,}000 \times 1.02^{10}$, which in today's purchasing power is
        $$100{,}000 \times \left(\frac{1.02}{1.03}\right)^{10} \approx 90{,}705$$
        dollars, a loss of about 9.3% of purchasing power. "Principal protected" guarantees only that the nominal amount does not fall, not purchasing power.
    rubric:
      zh-cn:
        - "判断为假，并用实际收益率为负或计算出购买力约减少 9.3% 说明（6 分）。"
        - "判断为假但只说“通胀会侵蚀收益”而没有说明实际收益率为负或计算：3 分。只写判断：0 分。"
      en:
        - "States false and explains with the negative real return or by computing the loss of about 9.3% of purchasing power (6 points)."
        - "False but only saying \"inflation eats into the return\" without showing that the real return is negative or computing it: 3 points. Only the verdict: 0 points."

  - id: Q2
    kind: quiz
    part: judge
    points: 6
    concepts: [marginal-rate-of-substitution, budget-constraint, preferences]
    question:
      zh-cn: |-
        两个消费者的偏好和收入都不同，但面对相同的两种商品价格，而且都处于内部最优（两种商品都买，无差异曲线光滑）。那么在各自的最优点，两人的边际替代率一定相等。
      en: |-
        Two consumers have different preferences and different incomes, but they face the same prices for two goods, and both are at an interior optimum (they buy both goods, and their indifference curves are smooth). Then at their respective optima, the two consumers' marginal rates of substitution must be equal.
    answer:
      zh-cn: |-
        真。内部最优点满足 $MRS = \frac{p_x}{p_y}$：如果某人的 MRS 大于价格比，他对 $x$ 的评价高于它在市场上的代价，多买 $x$ 能提高效用，所以那一点不是最优。两人面对同样的价格比，所以最优点的 MRS 都等于同一个数。偏好和收入不同，只使两人买的数量不同。
        这也说明市场价格的作用：最后一单位 $x$ 换 $y$ 的比率对每个人都一样，没有两个人还能通过互相交换都变得更好。
      en: |-
        True. An interior optimum satisfies $MRS = \frac{p_x}{p_y}$: if someone's MRS were above the price ratio, they would value $x$ more than its cost in the market, and buying more $x$ would raise utility, so that point would not be optimal. Both face the same price ratio, so at their optima both MRS equal the same number. Different preferences and incomes only make them buy different quantities.
        This also shows what market prices do: the rate at which the last unit of $x$ trades for $y$ is the same for everyone, so no two people could both gain by trading with each other.
    rubric:
      zh-cn:
        - "判断为真，并用相切条件 $MRS = \\frac{p_x}{p_y}$ 说明价格比对两人相同（6 分）。"
        - "判断为真但没有说明为什么最优点要满足这个条件，或只说“效用最大”：3 分。只写判断：0 分。"
      en:
        - "States true and explains with the tangency condition $MRS = \\frac{p_x}{p_y}$ that the price ratio is the same for both (6 points)."
        - "True but without explaining why the optimum must satisfy this condition, or only saying \"utility is maximized\": 3 points. Only the verdict: 0 points."

  - id: Q3
    kind: quiz
    part: judge
    points: 6
    concepts: [demand, supply, comparative-statics]
    question:
      zh-cn: |-
        过去五年，某城市的房价和住房成交量同时大幅上升。这说明这个城市的住房需求曲线是向上倾斜的：房价越高，人们想买的住房越多。
      en: |-
        Over the past five years, house prices and the number of home sales in a city have both risen sharply. This shows that the city's demand curve for housing slopes upward: the higher the price, the more housing people want to buy.
    answer:
      zh-cn: |-
        假。观测到的每一年的价格和数量都是当年需求曲线与供给曲线的交点，不同年份的交点不在同一条需求曲线上。价格和数量同时上升，最自然的解释是需求曲线向右移动（例如人口流入、收入上升、利率下降），新的均衡沿着向上倾斜的供给曲线移动。在每一年里，需求曲线本身仍可以是向下倾斜的。要估计需求曲线，需要找到只移动供给、不移动需求的变化。
      en: |-
        False. Each year's observed price and quantity are the intersection of that year's demand and supply curves, and the intersections in different years do not lie on one demand curve. The natural explanation for price and quantity rising together is that the demand curve shifted right (for example, people moving in, higher incomes, lower interest rates), so the new equilibrium moved along the upward-sloping supply curve. In each year the demand curve itself can still slope downward. To estimate the demand curve, one needs changes that shift supply without shifting demand.
    rubric:
      zh-cn:
        - "判断为假，指出这是需求曲线移动、沿供给曲线移动的结果，观测点不在同一条需求曲线上（6 分）。"
        - "判断为假但只说“还有其他因素”而没有说明需求移动与供给曲线的关系：3 分。只写判断：0 分。"
      en:
        - "States false and explains that demand shifted and the equilibrium moved along the supply curve, so the observations are not on one demand curve (6 points)."
        - "False but only saying \"other factors matter\" without relating the demand shift to the supply curve: 3 points. Only the verdict: 0 points."

  - id: Q4
    kind: quiz
    part: judge
    points: 6
    concepts: [deadweight-loss, tax-incidence, price-elasticity]
    question:
      zh-cn: |-
        如果一种商品的需求完全没有弹性（无论价格多少，需求量都不变），对它按每单位征税不会造成无谓损失。
      en: |-
        If demand for a good is perfectly inelastic (the quantity demanded is the same at any price), a per-unit tax on it causes no deadweight loss.
    answer:
      zh-cn: |-
        真。无谓损失来自因为征税而不再发生的交易。需求完全没有弹性时，买方付的价格上升整个税额，需求量不变，卖方得到的价格不变，成交量也不变：原来所有支付意愿高于成本的交易都照样发生。税收只是从买方转给政府，总剩余没有减少。（这时税负全部由买方承担。）一般地，买卖双方对价格越不敏感，同样的税造成的无谓损失越小。
      en: |-
        True. Deadweight loss comes from trades that no longer happen because of the tax. With perfectly inelastic demand, the price buyers pay rises by the whole tax, the quantity demanded does not change, the price sellers receive does not change, and neither does the quantity traded: every trade in which the willingness to pay exceeded the cost still happens. The tax is only a transfer from buyers to the government, and total surplus does not fall. (Buyers bear the whole tax in this case.) In general, the less sensitive buyers and sellers are to the price, the smaller the deadweight loss from a given tax.
    rubric:
      zh-cn:
        - "判断为真，并说明成交量不变、没有交易因税而消失，税收只是转移（6 分）。"
        - "判断为真但只说“需求不变”而没有联系到无谓损失的来源：3 分。只写判断：0 分。"
      en:
        - "States true and explains that the quantity traded does not change, no trades are lost, and the tax is only a transfer (6 points)."
        - "True but only saying \"demand does not change\" without linking it to the source of deadweight loss: 3 points. Only the verdict: 0 points."

  - id: Q5
    kind: quiz
    part: problem
    points: 15
    concepts: [adverse-selection, asymmetric-information, present-value]
    expected: { avg: "145", share: "13.79", keep: "193.97", debt: "205" }
    question:
      zh-cn: |-
        有两类公司，各占一半。“好公司”现有资产值 200（百万美元），“差公司”现有资产值 40。两类公司都有一个新项目：投资 20，投资后使公司价值增加 25（净现值为 +5）。经理知道自己公司属于哪一类，并为现有股东的利益做决定；外部投资者分不清，只知道各占一半，并按他们的判断公平地为新股定价。公司没有现金，要投资就必须先融资 20。

        (a) 如果两类公司都发行新股融资，投资者会按什么价值为发行新股的公司定价？新股东要得到公司的多大比例？好公司的老股东最后拥有的价值是多少？好公司会发行新股去投资吗？（8 分）

        (b) 如果好公司可以改为借入 20 的无风险债务（到期偿还 20），它会投资吗？为什么债务能避免 (a) 中的问题？（7 分）
      en: |-
        There are two kinds of company, half of each. A "good company" has existing assets worth 200 (million dollars), and a "bad company" has existing assets worth 40. Both kinds have a new project: investing 20 raises the company's value by 25 (a net present value of +5). Managers know which kind their company is and decide in the interest of the existing shareholders; outside investors cannot tell, know only that half are of each kind, and price new shares fairly given what they believe. The companies have no cash, so to invest they must first raise 20.

        (a) If both kinds raise the money by issuing new shares, at what value will investors price a company that issues new shares? What share of the company must the new shareholders receive? What is the value finally owned by the old shareholders of a good company? Will a good company issue new shares to invest? (8 points)

        (b) If a good company can instead borrow 20 of risk-free debt (repaying 20 at maturity), will it invest? Why does debt avoid the problem in (a)? (7 points)
    answer:
      zh-cn: |-
        (a) 两类都发行时，投资后好公司值 225，差公司值 65，投资者按平均值 $\frac{225 + 65}{2} = 145$ 定价。融资 20 需要让新股东得到 $\frac{20}{145} \approx 13.79\%$。好公司的老股东最后拥有 $225 \times (1 - 13.79\%) \approx 193.97$，少于不投资时的 200。所以好公司不会发行新股：它的股票被按平均值低估，新股东拿走的价值（约 31）超过了项目的净现值 5。
        结果只有差公司发行新股（对差公司的老股东，按平均价值发行是占便宜）。投资者也会想到这一点，把发行新股看作“我是差公司”的信号；这正是公司宣布增发时股价往往下跌的原因。好公司放弃了一个净现值为正的项目，这是逆向选择造成的效率损失。
        (b) 会。借 20、投资后公司值 225，偿还 20 后老股东得到 205，多于不投资时的 200。无风险债务到期只需偿还 20，它的价值不取决于公司属于哪一类，所以投资者不需要判断公司的类型，好公司也不必把被低估的股份让给新股东。融资工具的价值对公司的内部信息越不敏感，逆向选择的问题越小；这是公司通常先用内部资金和债务、最后才发行新股的原因之一。
      en: |-
        (a) If both kinds issue, after investing a good company is worth 225 and a bad one 65, so investors price an issuer at the average $\frac{225 + 65}{2} = 145$. Raising 20 requires giving new shareholders $\frac{20}{145} \approx 13.79\%$. The old shareholders of a good company end up with $225 \times (1 - 13.79\%) \approx 193.97$, less than the 200 they have without investing. So a good company will not issue new shares: its shares are undervalued at the average, and the value taken by the new shareholders (about 31) exceeds the project's net present value of 5.
        In the end only bad companies issue new shares (for their old shareholders, issuing at the average value is a bargain). Investors can work this out too and read a share issue as a sign of "I am a bad company"; this is exactly why share prices often fall when companies announce an issue. The good company gives up a project with a positive net present value, an efficiency loss caused by adverse selection.
        (b) Yes. Borrowing 20 and investing makes the company worth 225, and after repaying 20 the old shareholders get 205, more than the 200 without investing. Risk-free debt requires repaying only 20, so its value does not depend on which kind the company is; investors do not need to judge the company's type, and the good company does not have to hand undervalued shares to new shareholders. The less the value of a financing instrument depends on the company's inside information, the smaller the adverse-selection problem; this is one reason companies usually use internal funds and debt first and issue new shares last.
    rubric:
      zh-cn:
        - "(a) 按平均值 145 定价（2 分）；新股东比例约 13.79%（2 分）；好公司老股东约 193.97 < 200，不发行（2 分）；说明股票被低估、让出的价值超过净现值 5，好公司放弃正净现值项目（2 分）。只说“净现值为正所以投资”：最多 2 分。"
        - "(b) 老股东得到 205 > 200，会投资（3 分）；说明无风险债务的价值与公司类型无关，不需要按平均值定价（4 分）。"
      en:
        - "(a) Priced at the average of 145 (2 points); new shareholders' share about 13.79% (2 points); old shareholders of a good company about 193.97 < 200, so it does not issue (2 points); explains that the shares are undervalued and the value given away exceeds the net present value of 5, so a positive-NPV project is lost (2 points). Only \"the NPV is positive, so it invests\": at most 2 points."
        - "(b) Old shareholders get 205 > 200, so it invests (3 points); explains that the value of risk-free debt does not depend on the company's type, so no pricing at the average is needed (4 points)."

  - id: Q6
    kind: quiz
    part: problem
    points: 15
    concepts: [economic-profit, perfect-competition, barriers-to-entry, economic-moat, growing-perpetuity]
    expected: { a: "26.32", b: "125", gap: "98.68" }
    question:
      zh-cn: |-
        公司 A 和公司 B 今年都赚得 10（百万美元）的经济利润，即扣除包括资本的机会成本在内的全部成本之后还剩 10。A 所在的行业可以自由进入，新的竞争者会不断进入，A 每年的经济利润比上一年减少 30%（明年年末 10，后年年末 7，……）。B 有很强的进入壁垒，经济利润会永远保持每年 10（每年年末）。折现率为 8%。

        (a) 两家公司未来经济利润的现值各是多少？（7 分）

        (b) 一位分析师说：“两家公司今年的经济利润一样，市场为它们支付的溢价也应该一样。”评价这个说法，并说明：为什么 A 的经济利润会消失？要判断 B 的利润真的能持续，需要看什么？（8 分）
      en: |-
        Companies A and B both earn an economic profit of 10 (million dollars) this year, that is, 10 is left after all costs including the opportunity cost of capital. A's industry has free entry, new competitors keep coming in, and A's economic profit falls by 30% each year (10 at the end of next year, 7 at the end of the year after, and so on). B has strong barriers to entry, and its economic profit stays at 10 every year forever (at each year's end). The discount rate is 8%.

        (a) What is the present value of each company's future economic profit? (7 points)

        (b) An analyst says: "The two companies earn the same economic profit this year, so the market should pay the same premium for both." Evaluate this statement, and explain: why does A's economic profit disappear? What would you need to see to judge that B's profit really will last? (8 points)
    answer:
      zh-cn: |-
        (a) A 是增长率为 −30% 的增长永续年金：$\frac{10}{0.08 - (-0.30)} = \frac{10}{0.38} \approx 26.32$。B 是永续年金：$\frac{10}{0.08} = 125$。相差约 98.68。
        (b) 说法不对：价值取决于经济利润能持续多久，而不只是今年有多少。按今年的利润给两家同样的溢价，会大大高估 A。
        A 的利润消失，是因为在可以自由进入的行业，正的经济利润会吸引新厂商进入或模仿，供给增加、价格下降，直到经济利润为 0（[[1.5]]、[[1.6]] 的长期均衡与垄断竞争）。
        要判断 B 的利润能否持续，要看它是否真有阻止竞争者以相近成本进入或模仿的壁垒：规模经济、网络效应、转换成本、专利或牌照等无形资产、成本优势；并检验这些壁垒会不会因为技术变化或专利到期而变窄。证据可以是：资本回报率多年持续高于资本成本，竞争者进入后市场份额和价格仍然稳定。
      en: |-
        (a) A is a growing perpetuity with growth rate −30%: $\frac{10}{0.08 - (-0.30)} = \frac{10}{0.38} \approx 26.32$. B is a perpetuity: $\frac{10}{0.08} = 125$. The difference is about 98.68.
        (b) The statement is wrong: value depends on how long the economic profit lasts, not only on how large it is this year. Paying the same premium for both based on this year's profit would greatly overvalue A.
        A's profit disappears because in an industry with free entry, positive economic profit attracts new firms that enter or copy, supply rises and prices fall until economic profit is 0 (the long-run equilibrium and monopolistic competition of [[1.5]] and [[1.6]]).
        To judge whether B's profit can last, check whether it really has barriers that keep competitors from entering or copying at similar cost: economies of scale, network effects, switching costs, intangible assets such as patents or licenses, cost advantages; and check whether these barriers may narrow because of technological change or expiring patents. Evidence could be a return on capital that has stayed above the cost of capital for many years, and market share and prices that stayed stable after competitors entered.
    rubric:
      zh-cn:
        - "(a) 认出 A 是增长率为负的增长永续年金，约 26.32（4 分）；B 为 125（3 分）。把 A 当作永续年金（125）：最多 3 分。"
        - "(b) 指出价值取决于利润的持续时间（2 分）；用自由进入解释 A 的利润消失（3 分）；说明需要检验进入壁垒及其持久性，给出至少一种可观察的证据（3 分）。"
      en:
        - "(a) Recognizes A as a growing perpetuity with a negative growth rate, about 26.32 (4 points); B is 125 (3 points). Treating A as a plain perpetuity (125): at most 3 points."
        - "(b) Points out that value depends on how long the profit lasts (2 points); explains A's disappearing profit with free entry (3 points); explains that the barriers to entry and their durability must be checked, with at least one observable piece of evidence (3 points)."

  - id: Q7
    kind: quiz
    part: problem
    points: 15
    concepts: [principal-agent-problem, risk-premium, crra-utility, certainty-equivalent]
    expected: { premium: "3.375", ce: "2.625", fee: "2000" }
    question:
      zh-cn: |-
        一位客户有 200,000 美元现金，这是她全部的金融资产；她还有一笔固定利率 4% 的房贷，余额也是 200,000 美元。她的理财顾问每年按他管理的资产收取 1% 的费用。顾问建议她不要提前还房贷，而是把 200,000 美元交给他投资一个股票组合：“这个组合的期望年收益是 7%，比房贷利率 4% 高，所以投资更划算。”组合年收益的标准差为 15%。客户的效用是 CRRA，相对风险厌恶系数 $\gamma = 3$。提前还清房贷相当于得到确定的 4% 的年收益。只比较一年，不考虑税。

        评价顾问的建议：对这位客户，哪种选择更好？顾问为什么会给出这样的建议？（15 分）
      en: |-
        A client has 200,000 dollars in cash, which is all of her financial assets; she also has a fixed-rate mortgage at 4% with a balance of 200,000 dollars. Her financial adviser charges 1% a year of the assets he manages. He advises her not to pay off the mortgage but to let him invest the 200,000 dollars in a stock portfolio: "This portfolio has an expected return of 7% a year, higher than the 4% mortgage rate, so investing pays more." The standard deviation of the portfolio's yearly return is 15%. The client has CRRA utility with a coefficient of relative risk aversion $\gamma = 3$. Paying off the mortgage is equivalent to a certain return of 4% a year. Compare one year only and ignore taxes.

        Evaluate the adviser's advice: which choice is better for this client? Why would the adviser give this advice? (15 points)
    answer:
      zh-cn: |-
        比较要在同样的基础上进行。顾问的比较有两个问题：
        第一，费用：扣除 1% 的费用后，期望收益只有 6%。
        第二，风险：还房贷得到的 4% 是确定的，投资的收益有风险。用 CRRA 的近似公式，按比例计算的风险溢价约为 $\frac12\gamma\sigma^2 = \frac12 \times 3 \times 0.15^2 = 3.375\%$，所以投资的确定性等价收益约为 $6\% - 3.375\% = 2.625\%$，低于确定的 4%。
        对这位客户，提前还房贷更好。（即使不扣费用，$7\% - 3.375\% = 3.625\%$ 也低于 4%。）
        顾问的建议反映了委托–代理问题：他的收入取决于管理的资产，客户投资时他每年得到约 2,000 美元，客户还房贷时他什么也得不到。客户（委托人）很难判断建议是否真的为自己着想（信息不对称）。办法包括：按固定费用付费、选择负有受托责任的顾问、要求顾问说明收费方式和利益冲突、自己按风险调整后比较。
      en: |-
        The comparison must be made on the same basis. The adviser's comparison has two problems.
        First, fees: after the 1% fee, the expected return is only 6%.
        Second, risk: the 4% from paying off the mortgage is certain, while the investment return is risky. By the CRRA approximation, the proportional risk premium is about $\frac12\gamma\sigma^2 = \frac12 \times 3 \times 0.15^2 = 3.375\%$, so the certainty-equivalent return of investing is about $6\% - 3.375\% = 2.625\%$, below the certain 4%.
        For this client, paying off the mortgage is better. (Even without the fee, $7\% - 3.375\% = 3.625\%$ is below 4%.)
        The advice reflects the principal-agent problem: the adviser's income depends on the assets he manages, so he earns about 2,000 dollars a year if she invests and nothing if she pays off the mortgage. The client (the principal) finds it hard to judge whether the advice really serves her (asymmetric information). Remedies include paying a fixed fee, choosing an adviser with a fiduciary duty, asking the adviser to explain how he is paid and his conflicts of interest, and making her own risk-adjusted comparison.
    rubric:
      zh-cn:
        - "扣除费用得 6%（2 分）。"
        - "用 $\\frac12\\gamma\\sigma^2$ 算出风险溢价约 3.375%，确定性等价约 2.625%，与确定的 4% 比较，结论为还房贷更好（7 分）。只比较 7% 与 4% 或 6% 与 4%：这部分最多 2 分。"
        - "指出顾问按资产收费带来的利益冲突（约 2,000 美元 / 年）及信息不对称，并给出一种对策（6 分）。"
      en:
        - "Subtracts the fee to get 6% (2 points)."
        - "Uses $\\frac12\\gamma\\sigma^2$ to get a risk premium of about 3.375% and a certainty-equivalent return of about 2.625%, compares it with the certain 4%, and concludes that paying off the mortgage is better (7 points). Only comparing 7% or 6% with 4%: at most 2 points for this part."
        - "Points out the conflict of interest from fees based on assets (about 2,000 dollars a year) and the asymmetric information, and gives one remedy (6 points)."

  - id: Q8
    kind: quiz
    part: problem
    points: 15
    concepts: [repeated-game, bertrand-model, prisoners-dilemma, oligopoly]
    expected: { d2: "0.5", n: "10" }
    question:
      zh-cn: |-
        一个行业有 $n$ 家相同的公司，产品完全相同，按伯特兰模型竞争价格，边际成本相同。如果所有公司都定垄断价格，行业每年的总利润是 $\pi$，平分给 $n$ 家。任何一家公司只要把价格定得略低于其他公司，当年就能得到几乎整个行业的利润 $\pi$。各公司采用触发策略：只要有人降过价，以后所有公司永远按边际成本定价。每年的折现因子为 $\delta$。

        (a) 求维持合谋所需的最小 $\delta$（用 $n$ 表示）。$n = 2$ 时是多少？（8 分）

        (b) 设 $\delta = 0.9$。最多有几家公司时合谋还能维持？用这个结果解释：为什么反垄断机构对公司很少的行业更警惕？（7 分）
      en: |-
        An industry has $n$ identical firms with identical products, competing on price as in the Bertrand model, with the same marginal cost. If all firms set the monopoly price, the industry's total yearly profit is $\pi$, split equally among the $n$ firms. Any firm that sets its price slightly below the others' captures almost the whole industry profit $\pi$ for that year. The firms use trigger strategies: once anyone has cut the price, all firms price at marginal cost forever. The yearly discount factor is $\delta$.

        (a) Find the smallest $\delta$ that sustains collusion (in terms of $n$). What is it for $n = 2$? (8 points)

        (b) Let $\delta = 0.9$. At most how many firms can there be for collusion to be sustained? Use this result to explain why antitrust authorities are more watchful of industries with few firms. (7 points)
    answer:
      zh-cn: |-
        (a) 守约每年得 $\frac{\pi}{n}$，现值 $\frac{\pi/n}{1 - \delta}$。今年降价得 $\pi$，以后价格等于边际成本，利润为 0，现值 $\pi$。守约至少一样好：$\frac{\pi/n}{1 - \delta} \ge \pi$，即 $1 - \delta \le \frac1n$，$\delta \ge 1 - \frac1n$。$n = 2$ 时 $\delta \ge 0.5$。
        (b) $1 - \frac1n \le 0.9$，$n \le 10$：最多 10 家。公司越多，每家从合谋中分到的利润 $\frac{\pi}{n}$ 越少，而降价一次仍能拿到整个市场，背叛的诱惑相对越大，合谋越难维持。公司很少时，即使没有明确的协议，靠重复博弈中的默契也可能维持高价，所以反垄断机构更关注集中度高的行业（以及让违约更容易被发现的信息交换）。
      en: |-
        (a) Keeping the agreement earns $\frac{\pi}{n}$ each year, with present value $\frac{\pi/n}{1 - \delta}$. Cutting the price this year earns $\pi$, after which the price equals marginal cost and profit is 0, so the present value is $\pi$. Keeping the agreement is at least as good when $\frac{\pi/n}{1 - \delta} \ge \pi$, that is, $1 - \delta \le \frac1n$, or $\delta \ge 1 - \frac1n$. For $n = 2$, $\delta \ge 0.5$.
        (b) $1 - \frac1n \le 0.9$ gives $n \le 10$: at most 10 firms. The more firms, the smaller each one's share of the collusive profit $\frac{\pi}{n}$, while cutting the price once still captures the whole market, so the temptation to cheat is relatively larger and collusion harder to sustain. With very few firms, high prices can be kept up by a tacit understanding in the repeated game even without an explicit agreement, which is why antitrust authorities pay more attention to concentrated industries (and to information exchange that makes cheating easier to detect).
    rubric:
      zh-cn:
        - "(a) 两个现值写对（4 分）；解出 $\\delta \\ge 1 - \\frac1n$（3 分）；$n = 2$ 时 0.5（1 分）。只比较一年的利润：最多 2 分。"
        - "(b) $n \\le 10$（3 分）；用分到的利润减少而背叛收益不变解释，并联系到集中度（4 分）。"
      en:
        - "(a) Both present values correct (4 points); solves $\\delta \\ge 1 - \\frac1n$ (3 points); 0.5 for $n = 2$ (1 point). Comparing only one year's profit: at most 2 points."
        - "(b) $n \\le 10$ (3 points); explains with the smaller share of collusive profit against an unchanged gain from cheating, and links this to concentration (4 points)."

  - id: Q9
    kind: quiz
    part: problem
    points: 16
    concepts: [tax-incidence, perfect-competition, short-run, long-run, economic-profit]
    expected: { pb: "44", ps: "38", q: "560", pl: "46", ql: "540" }
    question:
      zh-cn: |-
        一个完全竞争行业的市场需求为 $Q_d = 1000 - 10P$。短期内厂商数目不变，市场供给为 $Q_s = 20P - 200$。长期中厂商可以自由进入和退出，每家厂商的成本都相同，长期平均成本的最低值是 40，所以长期供给在价格 40 处是一条水平线。目前行业处于长期均衡。政府对每单位产品征收 6 美元的税，由厂商缴纳。

        (a) 短期内，买方付的价格、厂商得到的价格和成交量各是多少？税负怎样分配？（7 分）

        (b) 长期中会发生什么？求长期的买方价格和成交量。有人说：“这个税是向公司征的，最终由公司的股东承担。”评价这个说法。（9 分）
      en: |-
        A perfectly competitive industry has market demand $Q_d = 1000 - 10P$. In the short run the number of firms is fixed and market supply is $Q_s = 20P - 200$. In the long run firms can enter and exit freely, all firms have the same costs, and the minimum of long-run average cost is 40, so long-run supply is a horizontal line at a price of 40. The industry is currently in long-run equilibrium. The government imposes a tax of 6 dollars per unit, paid by the firms.

        (a) In the short run, what are the price buyers pay, the price firms receive and the quantity traded? How is the burden of the tax split? (7 points)

        (b) What happens in the long run? Find the long-run price buyers pay and the quantity traded. Someone says: "This tax is levied on companies, so in the end it is borne by their shareholders." Evaluate this statement. (9 points)
    answer:
      zh-cn: |-
        (a) 税前：$1000 - 10P = 20P - 200$，$P = 40$，$Q = 600$，与长期均衡一致。征税后 $1000 - 10P_b = 20(P_b - 6) - 200$，$P_b = 44$，$P_s = 38$，$Q = 560$。买方每单位多付 4，厂商少得 2：短期内买方承担三分之二，厂商承担三分之一（短期供给对价格的反应比需求更强）。
        (b) 短期内厂商得到的 38 低于长期平均成本的最低值 40，经济利润为负，一部分厂商会退出。退出使供给减少，直到厂商得到的价格回到 40、经济利润回到 0。长期中 $P_s = 40$，$P_b = 46$，$Q = 1000 - 460 = 540$。
        这个说法只在短期部分成立：调整期间，现有厂商的股东承担了亏损（厂商得到的价格低于平均成本）。但长期中，可以自由进入和退出、成本不变的行业，供给完全有弹性，厂商得到的价格回到 40，税负全部由买方承担。税由谁缴纳不决定谁承担；随着时间延长，供给越来越有弹性，税负越来越多地转给买方。
      en: |-
        (a) Before the tax: $1000 - 10P = 20P - 200$ gives $P = 40$ and $Q = 600$, consistent with the long-run equilibrium. With the tax, $1000 - 10P_b = 20(P_b - 6) - 200$ gives $P_b = 44$, $P_s = 38$ and $Q = 560$. Buyers pay 4 more per unit and firms receive 2 less: in the short run buyers bear two thirds and firms one third (short-run supply responds to the price more than demand does).
        (b) In the short run, the 38 firms receive is below the minimum long-run average cost of 40, so economic profit is negative and some firms exit. Exit reduces supply until the price firms receive returns to 40 and economic profit returns to 0. In the long run $P_s = 40$, $P_b = 46$ and $Q = 1000 - 460 = 540$.
        The statement holds only for the short run: during the adjustment, the shareholders of existing firms bear losses (the price they receive is below average cost). But in the long run, in an industry with free entry and exit and constant costs, supply is perfectly elastic, the price firms receive returns to 40, and buyers bear the whole tax. Who pays a tax does not decide who bears it; as time passes and supply becomes more elastic, more of the tax is passed on to buyers.
    rubric:
      zh-cn:
        - "(a) $P_b = 44$，$P_s = 38$，$Q = 560$（4 分）；买方承担 4、厂商承担 2，并联系到双方对价格的反应（3 分）。"
        - "(b) 说明厂商亏损、退出，直到 $P_s$ 回到 40（3 分）；$P_b = 46$，$Q = 540$（2 分）；评价：短期股东承担一部分，长期税负全部转给买方，税负取决于弹性而不是由谁缴税（4 分）。同意“由股东承担”而没有区分短期和长期：这部分最多 1 分。"
      en:
        - "(a) $P_b = 44$, $P_s = 38$, $Q = 560$ (4 points); buyers bear 4 and firms 2, linked to how each side responds to the price (3 points)."
        - "(b) Explains that firms make losses and exit until $P_s$ returns to 40 (3 points); $P_b = 46$, $Q = 540$ (2 points); evaluation: shareholders bear part in the short run, buyers bear the whole tax in the long run, and the split depends on elasticity, not on who pays (4 points). Agreeing that shareholders bear it without distinguishing the short and long run: at most 1 point for this part."
